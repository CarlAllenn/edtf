[workspace]
resolver = "2"
members = ["crates/edtf-core", "crates/edtf-calendars", "crates/edtf-wasm", "crates/edtf-cli"]
# crates/edtf-postgres is intentionally NOT a workspace member: pgrx
# extensions need their own dependency graph and a locally-initialized pgrx
# toolchain (`cargo pgrx init`). Build/test it via `task pg:test`.
# fuzz/ is excluded for the same reason: cargo-fuzz targets need nightly and
# libfuzzer, and must not drag those into the everyday workspace build.
exclude = ["crates/edtf-postgres", "fuzz"]

[workspace.dependencies]
edtf-core = { path = "crates/edtf-core", version = "0.2.0" }
edtf-calendars = { path = "crates/edtf-calendars", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
# Model-side property tests; std-only subset (no fork/timeout machinery).
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlAllenn/edtf"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Size-tuned release: matters most for the wasm artifact; the CLI and core
# are tiny either way, and edtf-postgres has its own workspace/profile.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
