---
# CodeQL static analysis (SAST) over the two languages this repo actually
# contains code in: Rust and GitHub Actions workflows. Rust runs with
# build-mode none — CodeQL extracts from source without invoking cargo, so
# the job needs no toolchain install and the pg-feature-exclusive
# edtf-postgres crate poses no build problem.
#
# Gates pull requests alongside ci.yml, and runs weekly so advisory-driven
# query updates re-scan an unchanged main (same rationale as scheduled.yml's
# never-fingerprint class).
name: codeql

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Offset from ci.yml's weekly gate (07:00) and scheduled.yml's
    # scanners so shared-cause failures are distinguishable by timing.
    - cron: 0 8 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      # Audit, not block — the same quarantine rationale as scheduled.yml's
      # scorecard job: the CodeQL bundle and query packs download from a
      # wide, version-varying set of hosts, so the allowlist gets read off
      # live runs rather than guessed at here. Nothing secret-bearing runs
      # in this job beyond the scoped SARIF upload token.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
