---
name: Publish

# PHASE 2 of two (issue #54). Triggered by the umbrella tag that
# release-plz.yml pushes on Release PR merge. This run builds, publishes
# and attests — all three in one job whose `github.ref` IS the tag, so the
# provenance it produces names the tag and the tagged commit.
#
# Why this workflow exists at all: at v1.0.0 publishing happened on `main`,
# the run failed partway, and the recovery attested crates it had merely
# downloaded from crates.io. Digests matched, `gh attestation verify`
# passed, and the provenance still named a commit (`1e80e45`) that built
# none of the bytes. Sigstore is append-only, so that record is permanent.
#
# The invariant this workflow enforces, in order:
#   package -> publish -> prove local bytes == registry bytes -> attest
# Attestation happens last and only on proof, so there is no window in
# which something gets signed that is not what shipped.

"on":
  push:
    # Umbrella tag only. The per-crate tags (edtf-core-v1.0.1 …) do not
    # match, so exactly one run fires per release.
    tags: [v*]
  # Resume and rehearsal path. ALWAYS dispatch with --ref <tag>: dispatching
  # from a branch would publish with branch-ref provenance, recreating the
  # exact defect this workflow exists to prevent. The guard below refuses to
  # run on anything that is not a tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and print provenance, publish nothing
        type: boolean
        default: true

permissions: {}

# Never cancel a publish mid-flight.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Prebuilt edtf-postgres artifacts (issue #55). A separate job because
  # arm64 needs its own runner — `github.ref` is scoped to the workflow run,
  # not the job, so splitting this out does NOT weaken the provenance
  # property the publish job depends on. What makes provenance correct is
  # the tag trigger, not single-job-ness.
  #
  # It runs BEFORE publish (`needs:` below) on purpose. crates.io is
  # irreversible and a tarball is not, so anything that can still fail
  # cheaply must fail before the release commits to a registry. A broken
  # tarball ends the run while everything is still recoverable, rather than
  # stranding a half-published release.
  extension:
    name: Extension pg${{ matrix.pg }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # One failing cell must not hide the state of the other nine.
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          # GA and free on public repositories, so both architectures build
          # natively and no QEMU is involved.
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Routed through env so no template expands inside run: code
      # (zizmor template-injection, pedantic tier).
      PG: ${{ matrix.pg }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The container's own egress is listed here too: apt and rustup run
      # inside `postgres:<major>-bookworm`, and container traffic traverses
      # the host's stack. Listing them is correct whether or not
      # harden-runner filters it — an unlisted host that turns out to be
      # filtered would fail the build for a reason unrelated to the code.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            registry-1.docker.io:443
            auth.docker.io:443
            # Docker Hub serves blobs from BOTH of these and picks per
            # request — cloudflare and cloudfront, one letter apart. Listing
            # only the first fails as `error pulling image configuration`
            # against a raw AWS IP, with the hostname visible solely in
            # harden-runner's own log (`domain not allowed:
            # production.cloudfront.docker.com`). Found by the first
            # rehearsal, and only on amd64: the arm64 runners did not
            # enforce, so a green arm64 leg proves nothing about egress.
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            deb.debian.org:80
            deb.debian.org:443
            apt.postgresql.org:80
            apt.postgresql.org:443
            sh.rustup.rs:443
            static.rust-lang.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          # Single-purpose job: the toolchain lives inside the build
          # container, so the runner needs only the TOML reader that derives
          # the pins from mise.toml.
          install_args: taplo
          cache: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      # The publish job re-derives this and additionally asserts that the tag
      # agrees; here it only has to name the artifact.
      - name: Resolve version
        run: |
          set -euo pipefail
          version=$(taplo get -f crates/edtf-postgres/Cargo.toml 'package.version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the extension tarball
        env:
          OUT_DIR: ${{ runner.temp }}/ext
        run: .github/scripts/build-extension.sh

      # Built on bookworm (glibc 2.36), exercised on both bookworm and
      # trixie (2.41). Testing only where it was built would assume glibc
      # forward compatibility rather than demonstrate it.
      - name: Smoke test on bookworm
        env:
          DISTRO: bookworm
          OUT_DIR: ${{ runner.temp }}/ext
        run: |
          set -euo pipefail
          TARBALL="${OUT_DIR}/edtf_postgres-${VERSION}-pg${PG}-linux-${ARCH}.tar.gz" \
            .github/scripts/smoke-extension.sh

      - name: Smoke test on trixie
        env:
          DISTRO: trixie
          OUT_DIR: ${{ runner.temp }}/ext
        run: |
          set -euo pipefail
          TARBALL="${OUT_DIR}/edtf_postgres-${VERSION}-pg${PG}-linux-${ARCH}.tar.gz" \
            .github/scripts/smoke-extension.sh

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edtf-postgres-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/ext/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Prebuilt edtf-cli binaries (issue #84): the CLI was the one artifact
  # with no prebuilt release, which forced downstream lockfiles into a
  # bare-version cargo: pin — no checksum, no URL, no provenance. Same
  # shape as the extension job: native hardware per target (a binary
  # released for a target must have had its tests run ON that target),
  # before publish so a broken build fails while everything is recoverable.
  cli:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # One failing cell must not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      # Routed through env so no template expands inside run: code
      # (zizmor template-injection, pedantic tier).
      TARGET: ${{ matrix.target }}
    steps:
      # Linux only: harden-runner does not support macOS runners. The mac
      # legs run the same pinned toolchain against the same lockfile; their
      # egress is unenforced because no enforcement exists there, not
      # because it is exempt.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            static.rust-lang.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          # Single-purpose job: the pinned Rust toolchain to build with and
          # the TOML reader that derives the version from Cargo.toml.
          install_args: rust taplo
          # No tool cache in the publishing workflow (zizmor
          # cache-poisoning, high) — same rationale as the publish job.
          cache: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      # The publish job re-derives this and additionally asserts that the tag
      # agrees; here it only has to name the artifact.
      - name: Resolve version
        run: |
          set -euo pipefail
          version=$(taplo get -f crates/edtf-cli/Cargo.toml 'package.version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build, test and package the CLI
        env:
          OUT_DIR: ${{ runner.temp }}/cli
        run: .github/scripts/build-cli.sh

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edtf-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/cli/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish + attest (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Every tarball must exist — and the extension must have installed
    # cleanly, the CLI passed its suite on every target — before the
    # release commits anything to a registry.
    needs: [extension, cli]
    permissions:
      contents: write # upload assets to the releases, publish the drafts
      id-token: write # OIDC: crates.io + npm trusted publishing, attestations
      attestations: write # store build provenance
    steps:
      # Egress allowlist: registry publishes, npm + sigstore, toolchain hosts.
      # The last two are GitHub's own TUF trust root and its target store:
      # `gh attestation verify` fetches them to verify GitHub-signed
      # attestations, and the v1.0.1 self-verify step failed solely because
      # they were absent here (issue #66) — every artifact reported
      # "provenance does not match" when the truth was "could not fetch the
      # trust root to check".
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            search.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443
            # canary-extension.sh runs `docker` in THIS job: it installs the
            # released tarball into a clean Postgres. Docker Hub serves blobs
            # from cloudflare AND cloudfront, choosing per request, so both
            # are required (v1.1.0: the extension job had them, this job did
            # not, and the step would have failed on egress the moment its
            # executable bit was fixed).
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Sets DRY_RUN from the event name rather than from an expression over
      # the `inputs` context, whose value on non-dispatch events GitHub does
      # not document. See the script header.
      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      # Refuse to PUBLISH from a non-tag ref. Provenance is the product here,
      # and a branch ref would silently reproduce the v1.0.0 defect. A dry
      # run is exempt: it signs nothing, so it has no provenance to get
      # wrong — and without the exemption the rehearsal is unreachable.
      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          install_args: rust node aqua:rustwasm/wasm-pack cargo:cargo-cyclonedx
          # No tool cache in the publishing workflow (zizmor cache-poisoning,
          # high). Everything this job builds gets signed, so a poisoned
          # cache entry would be laundered into an attested artifact. mise
          # runs locked with per-tool checksums, so the cache only ever
          # bought time — and time is not what this job optimizes for.
          cache: false

      - name: Resolve version and assert it matches the tag
        run: .github/scripts/resolve-version.sh

      # Taken before any publish step could run, so the dry-run
      # post-condition compares state rather than asserting absence.
      - name: Snapshot registry state
        run: .github/scripts/snapshot-registry-state.sh "${RUNNER_TEMP}/registry-before.txt"

      # --- package -------------------------------------------------------
      # Explicitly enumerated, never globbed: edtf-postgres is its own
      # workspace and needs different flags, and a glob is what let it get
      # treated as one of the five and silently skipped at v1.0.0.
      - name: Package all six crates
        run: .github/scripts/package-all.sh

      - name: Assert packaging is deterministic
        run: .github/scripts/assert-deterministic.sh

      - name: Build wasm package
        run: wasm-pack build crates/edtf-wasm --release

      # --- collect the extension tarballs ---------------------------------
      # STRICTLY after the determinism assertion. That step re-runs
      # package-all.sh, which begins `rm -rf dist` — anything placed in dist/
      # before it is deleted silently, and the run would simply proceed with
      # fewer assets than intended.
      #
      # Landing them in dist/ is what wires them into the existing
      # machinery with no new attestation plumbing: `actions/attest` already
      # takes `subject-path: dist/*`, and self-verify-attestations.sh
      # already loops over dist/*. The npm tarball is the precedent —
      # verify-registry-bytes.sh copies it into dist/ for the same reason.
      - name: Collect the extension tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edtf-postgres-pg*
          merge-multiple: true
          path: dist

      - name: Collect the CLI tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: edtf-cli-*
          merge-multiple: true
          path: dist

      # One SHA256SUMS over both artifact families; the count assertions
      # inside are what catch a silently missing matrix cell.
      - name: Checksum the binary tarballs
        run: .github/scripts/checksum-artifacts.sh

      # Before the publish, and unguarded: nothing here depends on anything
      # being published, so running it in the rehearsal turns the `cp` loop
      # and cargo-cyclonedx's output layout into a cheap pre-publish
      # failure. The attest steps that CONSUME sbom/*.cdx.json stay where
      # they are, after the proof.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5
          cargo cyclonedx --format json --spec-version 1.5 \
            --manifest-path crates/edtf-postgres/Cargo.toml
          mkdir -p sbom
          # MOVED, not copied. cargo-cyclonedx has no output-directory flag —
          # it always writes beside the manifest — so a copy leaves
          # crates/<name>/<name>.cdx.json behind and the working tree dirty.
          # `cargo publish` then refuses outright: "files in the working
          # directory contain changes that were not yet committed into git".
          # That is what broke v1.1.1, on the first crate, the moment this
          # step was hoisted above the publish so the rehearsal could cover it.
          for name in edtf-core edtf-calendars edtf-normalize edtf-wasm edtf-cli edtf-postgres; do
            mv "crates/${name}/${name}.cdx.json" "sbom/${name}.cdx.json"
          done
          ls -1 sbom/

      # --- rehearsal exit ------------------------------------------------
      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Dry run — nothing published"
            echo
            echo "Provenance this release *would* record:"
            echo
            echo '```'
            echo "ref:       ${GITHUB_REF}"
            echo "gitCommit: ${GITHUB_SHA}"
            echo '```'
            echo
            echo "Artifact digests:"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/digests-2.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Dry-run safety otherwise rests on every publishing step below
      # carrying its `if:` guard — a convention a future edit can forget.
      # This checks the post-condition instead of trusting the convention.
      - name: Assert the rehearsal published nothing
        if: env.DRY_RUN == 'true'
        run: .github/scripts/assert-nothing-published.sh

      # Nothing above may leave the working tree dirty. `cargo publish`
      # refuses to publish from a dirty tree, and it refuses on the FIRST
      # crate — so the failure is safe but total, and it is invisible until
      # a real release reaches this line. v1.1.1 died here. Asserting it
      # explicitly turns "no step writes into the tree" from a convention
      # into a checked precondition, one step before it would matter.
      - name: Assert the working tree is clean
        run: |
          set -euo pipefail
          # UNTRACKED files count. cargo publish rejected v1.1.1 over
          # crates/edtf-core/edtf-core.cdx.json, which was untracked, not
          # modified — so a guard using --untracked-files=no would miss the
          # exact defect it exists to catch. Release staging (dist/, sbom/)
          # is gitignored, so it does not register here.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the working tree is dirty; cargo publish will refuse"
            git status --porcelain
            exit 1
          fi
          echo "::notice::working tree is clean"

      # --- publish -------------------------------------------------------
      # Trusted publishing: short-lived crates.io token via OIDC exchange —
      # no CARGO_REGISTRY_TOKEN secret exists in this repository.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: env.DRY_RUN != 'true'
        id: auth

      # Per-crate guard in dependency order, so a run that dies partway can
      # simply be re-dispatched at the same tag. See the script header.
      - name: Publish all six crates to crates.io
        if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/scripts/publish-crates.sh

      # npm trusted publisher: OIDC, provenance automatic on public packages.
      - name: Publish edtf-wasm to npm
        if: env.DRY_RUN != 'true'
        run: .github/scripts/publish-npm.sh

      # --- prove before signing ------------------------------------------
      # The registry is the thing consumers download. If what it holds is
      # not byte-identical to what this run built, attesting the local files
      # would assert something false — so this fails the release instead.
      - name: Verify registry bytes match local bytes
        if: env.DRY_RUN != 'true'
        run: .github/scripts/verify-registry-bytes.sh

      # --- attest --------------------------------------------------------
      # Subjects are the files THIS run built and just proved identical to
      # the registry's — never a re-download. That distinction is the whole
      # point of issue #54.
      # actions/attest, not actions/attest-build-provenance: as of v4 the
      # latter is a wrapper over this action, and upstream directs new
      # implementations here. Provenance is this action's default predicate.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-provenance
        with:
          subject-path: dist/*

      # cargo-cyclonedx emits one SBOM per package, next to that package's
      # manifest. edtf-postgres needs its own invocation — separate
      # workspace, so the root run does not see it.

      # One SBOM per crate, attested against that crate only. `sbom-path`
      # takes a single file, so a shared step would attach one crate's
      # dependency list to all six — asserting, for example, that
      # edtf-core's (empty) dependency set describes edtf-cli. Enumerated
      # rather than looped because a GitHub Action cannot be run in a shell
      # loop, and silent breakage here is a false SBOM claim.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-core
        with:
          subject-path: dist/edtf-core-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-core.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-calendars
        with:
          subject-path: dist/edtf-calendars-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-calendars.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-normalize
        with:
          subject-path: dist/edtf-normalize-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-normalize.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-wasm
        with:
          subject-path: dist/edtf-wasm-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-wasm.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-cli
        with:
          subject-path: dist/edtf-cli-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-cli.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-postgres
        with:
          subject-path: dist/edtf-postgres-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-postgres.cdx.json

      # --- prove the attestation itself ----------------------------------
      # The check that would have caught v1.0.0 automatically. A passing
      # `gh attestation verify` is NOT sufficient — the v1.0.0 artifacts
      # pass it today while naming the wrong commit. What matters is which
      # ref and commit the provenance records.
      - name: Self-verify attestation ref and commit
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/self-verify-attestations.sh

      # --- canary --------------------------------------------------------
      - name: Canary — consume from the registries
        if: env.DRY_RUN != 'true'
        run: .github/scripts/canary.sh

      # Per-crate releases, not the umbrella tag: phase 1 never creates an
      # umbrella release, and each SBOM describes exactly one crate anyway.
      - name: Attach SBOMs to the per-crate releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-sboms.sh

      # The attestations live in GitHub's attestation store, which is where
      # `gh attestation verify` looks — but a consumer (or Scorecard's
      # Signed-Releases check) inspecting the RELEASE sees nothing signed.
      # Publish the same Sigstore bundles as release assets. Collected via
      # each attest step's bundle-path output, routed through env so no
      # template expands inside run: code (zizmor template-injection).
      - name: Collect attestation bundles
        if: env.DRY_RUN != 'true'
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bundles
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_CORE: ${{ steps.attest-sbom-edtf-core.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_CALENDARS: ${{ steps.attest-sbom-edtf-calendars.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_NORMALIZE: ${{ steps.attest-sbom-edtf-normalize.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_WASM: ${{ steps.attest-sbom-edtf-wasm.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_CLI: ${{ steps.attest-sbom-edtf-cli.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_POSTGRES: ${{ steps.attest-sbom-edtf-postgres.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p "${BUNDLE_DIR}"
          # The provenance attest covered every dist/* subject in one call,
          # so each release receives a copy of the same bundle; the subjects
          # named inside it are what scope it, not the filename.
          for name in edtf-core edtf-calendars edtf-normalize edtf-wasm edtf-cli edtf-postgres; do
            cp "${PROVENANCE_BUNDLE}" "${BUNDLE_DIR}/${name}-${VERSION}.provenance.intoto.jsonl"
            var="SBOM_BUNDLE_$(tr '[:lower:]-' '[:upper:]_' <<< "${name}")"
            cp "${!var}" "${BUNDLE_DIR}/${name}-${VERSION}.sbom.intoto.jsonl"
          done
          ls -1 "${BUNDLE_DIR}"

      - name: Attach attestation bundles to the per-crate releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_DIR: ${{ runner.temp }}/bundles
        run: .github/scripts/upload-attestation-bundles.sh

      # Onto the edtf-postgres release, still a draft, alongside its SBOM.
      - name: Attach the extension tarballs
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-extension-assets.sh

      # Onto the edtf-cli release, still a draft. SHA256SUMS goes to both
      # releases — it is the one manifest over all binary artifacts.
      - name: Attach the CLI tarballs
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-cli-assets.sh

      # The stranger's path for the one artifact canary.sh cannot cover:
      # fetch what is attached to the release, prove it is what SHA256SUMS
      # names, and install it.
      - name: Canary — install the released extension tarball
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/canary-extension.sh

      # --- publish the releases ------------------------------------------
      # LAST, and only here: phase 1 cut these as drafts, so nothing has been
      # public until now. Everything above has already run — bytes proved
      # against the registries, attestations verified against the tag, the
      # canary consumed as a stranger, every asset attached. Publishing is
      # the commitment, and immutability makes it permanent, so it happens
      # once there is nothing left that could still fail.
      - name: Publish the per-crate releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-releases.sh
