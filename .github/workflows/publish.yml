---
name: Publish

# PHASE 2 of two (issue #54). Triggered by the umbrella tag that
# release-plz.yml pushes on Release PR merge. This run builds, publishes
# and attests — all three in one job whose `github.ref` IS the tag, so the
# provenance it produces names the tag and the tagged commit.
#
# Why this workflow exists at all: at v1.0.0 publishing happened on `main`,
# the run failed partway, and the recovery attested crates it had merely
# downloaded from crates.io. Digests matched, `gh attestation verify`
# passed, and the provenance still named a commit (`1e80e45`) that built
# none of the bytes. Sigstore is append-only, so that record is permanent.
#
# The invariant this workflow enforces, in order:
#   package -> publish -> prove local bytes == registry bytes -> attest
# Attestation happens last and only on proof, so there is no window in
# which something gets signed that is not what shipped.

"on":
  push:
    # Umbrella tag only. The per-crate tags (edtf-core-v1.0.1 …) do not
    # match, so exactly one run fires per release.
    tags: [v*]
  # Resume and rehearsal path. ALWAYS dispatch with --ref <tag>: dispatching
  # from a branch would publish with branch-ref provenance, recreating the
  # exact defect this workflow exists to prevent. The guard below refuses to
  # run on anything that is not a tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and print provenance, publish nothing
        type: boolean
        default: true

permissions: {}

# Never cancel a publish mid-flight.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Prebuilt edtf-postgres artifacts (issue #55). A separate job because
  # arm64 needs its own runner — `github.ref` is scoped to the workflow run,
  # not the job, so splitting this out does NOT weaken the provenance
  # property the publish job depends on. What makes provenance correct is
  # the tag trigger, not single-job-ness.
  #
  # It runs BEFORE publish (`needs:` below) on purpose. crates.io is
  # irreversible and a tarball is not, so anything that can still fail
  # cheaply must fail before the release commits to a registry. A broken
  # tarball ends the run while everything is still recoverable, rather than
  # stranding a half-published release.
  extension:
    name: Extension pg${{ matrix.pg }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Hang guard, not a budget: observed ~5m per cell (v1.2.0). Without it a
    # stalled step holds the release for GitHub's 360-minute default.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # One failing cell must not hide the state of the other nine.
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          # GA and free on public repositories, so both architectures build
          # natively and no QEMU is involved.
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Routed through env so no template expands inside run: code
      # (zizmor template-injection, pedantic tier).
      PG: ${{ matrix.pg }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The container's own egress is listed here too: apt and rustup run
      # inside `postgres:<major>-bookworm`, and container traffic traverses
      # the host's stack. Listing them is correct whether or not
      # harden-runner filters it — an unlisted host that turns out to be
      # filtered would fail the build for a reason unrelated to the code.
      #
      # On the two Docker Hub CDNs below: Hub serves blobs from BOTH and
      # picks per request — cloudflare and cloudfront, one letter apart.
      # Listing only the first fails as `error pulling image configuration`
      # against a raw AWS IP, with the hostname visible solely in
      # harden-runner's own log (`domain not allowed:
      # production.cloudfront.docker.com`). Found by the first rehearsal,
      # and only on amd64: the arm64 runners did not enforce, so a green
      # arm64 leg proves nothing about egress.
      #
      # This prose lives ABOVE the step deliberately. `allowed-endpoints:`
      # takes a folded block scalar, which does not strip `#` — comments
      # written inside it become part of the value and harden-runner parses
      # each whitespace-separated word as a hostname. See the fix commit.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            deb.debian.org:80
            deb.debian.org:443
            apt.postgresql.org:80
            apt.postgresql.org:443
            sh.rustup.rs:443
            static.rust-lang.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.18
          # Single-purpose job: the toolchain lives inside the build
          # container, so the runner needs only the TOML reader that derives
          # the pins from mise.toml.
          install_args: taplo
          cache: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      # The publish job re-derives this and additionally asserts that the tag
      # agrees; here it only has to name the artifact.
      - name: Resolve version
        run: |
          set -euo pipefail
          version=$(taplo get -f crates/edtf-postgres/Cargo.toml 'package.version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the extension tarball
        env:
          OUT_DIR: ${{ runner.temp }}/ext
        run: .github/scripts/build-extension.sh

      # Built on bookworm (glibc 2.36), exercised on both bookworm and
      # trixie (2.41). Testing only where it was built would assume glibc
      # forward compatibility rather than demonstrate it.
      - name: Smoke test on bookworm
        env:
          DISTRO: bookworm
          OUT_DIR: ${{ runner.temp }}/ext
        run: |
          set -euo pipefail
          TARBALL="${OUT_DIR}/edtf_postgres-${VERSION}-pg${PG}-linux-${ARCH}.tar.gz" \
            .github/scripts/smoke-extension.sh

      - name: Smoke test on trixie
        env:
          DISTRO: trixie
          OUT_DIR: ${{ runner.temp }}/ext
        run: |
          set -euo pipefail
          TARBALL="${OUT_DIR}/edtf_postgres-${VERSION}-pg${PG}-linux-${ARCH}.tar.gz" \
            .github/scripts/smoke-extension.sh

      # A real ALTER EXTENSION UPDATE from the previous release's published
      # tarball (issue #83) — the fresh-install legs above prove the chain
      # resolves; this executes it. Skips cleanly when no prior release
      # ships this cell's tarball.
      - name: Upgrade test from the previous release
        env:
          OUT_DIR: ${{ runner.temp }}/ext
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARBALL="${OUT_DIR}/edtf_postgres-${VERSION}-pg${PG}-linux-${ARCH}.tar.gz" \
            .github/scripts/upgrade-smoke-extension.sh

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edtf-postgres-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/ext/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Prebuilt edtf-cli binaries (issue #84): the CLI was the one artifact
  # with no prebuilt release, which forced downstream lockfiles into a
  # bare-version cargo: pin — no checksum, no URL, no provenance. Same
  # shape as the extension job: native hardware per target (a binary
  # released for a target must have had its tests run ON that target),
  # before publish so a broken build fails while everything is recoverable.
  cli:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Hang guard, not a budget: observed ~1.5m per cell (v1.2.0).
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One failing cell must not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      # Routed through env so no template expands inside run: code
      # (zizmor template-injection, pedantic tier).
      TARGET: ${{ matrix.target }}
    steps:
      # Linux only: harden-runner does not support macOS runners. The mac
      # legs run the same pinned toolchain against the same lockfile; their
      # egress is unenforced because no enforcement exists there, not
      # because it is exempt.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            static.rust-lang.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.18
          # Single-purpose job: the pinned Rust toolchain to build with and
          # the TOML reader that derives the version from Cargo.toml.
          install_args: rust taplo
          # No tool cache in the publishing workflow (zizmor
          # cache-poisoning, high) — same rationale as the publish job.
          cache: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      # The publish job re-derives this and additionally asserts that the tag
      # agrees; here it only has to name the artifact.
      - name: Resolve version
        run: |
          set -euo pipefail
          version=$(taplo get -f crates/edtf-cli/Cargo.toml 'package.version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build, test and package the CLI
        env:
          OUT_DIR: ${{ runner.temp }}/cli
        run: .github/scripts/build-cli.sh

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edtf-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/cli/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish + attest (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed 9m46s green (v1.1.2). Sized so a
    # slow registry never kills a live release, while a genuine hang dies as
    # a step failure with surviving logs — v1.2.0 hung ~40m in the canary
    # and the runner death destroyed them.
    timeout-minutes: 75
    # Deployment environment, reviewer-less: its purpose is to narrow the
    # OIDC subject claim, not to add a manual gate. With the registries'
    # trusted-publisher configs pinning this environment name, a token
    # exchange is possible only from THIS job of THIS workflow — any other
    # workflow in the repository, compromised or merely mistaken, presents
    # the wrong claim and is refused by crates.io and npm at issuance.
    # Registry side: crates.io per-crate Settings -> Trusted Publishing ->
    # environment `publish`; npm package Settings -> Trusted Publisher ->
    # environment `publish`. Set those AFTER this lands on main (an
    # unset environment field accepts any claim, so the transition is safe
    # in this order and broken in the other).
    environment: publish
    # Every tarball must exist — and the extension must have installed
    # cleanly, the CLI passed its suite on every target — before the
    # release commits anything to a registry.
    needs: [extension, cli]
    permissions:
      contents: write # upload assets to the releases, publish the drafts
      id-token: write # OIDC: crates.io + npm trusted publishing, attestations
      attestations: write # store build provenance
    steps:
      # Egress allowlist: registry publishes, npm + sigstore, toolchain hosts.
      # The last two are GitHub's own TUF trust root and its target store:
      # `gh attestation verify` fetches them to verify GitHub-signed
      # attestations, and the v1.0.1 self-verify step failed solely because
      # they were absent here (issue #66) — every artifact reported
      # "provenance does not match" when the truth was "could not fetch the
      # trust root to check".
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            search.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Sets DRY_RUN from the event name rather than from an expression over
      # the `inputs` context, whose value on non-dispatch events GitHub does
      # not document. See the script header.
      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      # Refuse to PUBLISH from a non-tag ref. Provenance is the product here,
      # and a branch ref would silently reproduce the v1.0.0 defect. A dry
      # run is exempt: it signs nothing, so it has no provenance to get
      # wrong — and without the exemption the rehearsal is unreachable.
      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.18
          install_args: rust node aqua:rustwasm/wasm-pack cargo:cargo-cyclonedx
          # No tool cache in the publishing workflow (zizmor cache-poisoning,
          # high). Everything this job builds gets signed, so a poisoned
          # cache entry would be laundered into an attested artifact. mise
          # runs locked with per-tool checksums, so the cache only ever
          # bought time — and time is not what this job optimizes for.
          cache: false

      - name: Resolve version and assert it matches the tag
        run: .github/scripts/resolve-version.sh

      # Taken before any publish step could run, so the dry-run
      # post-condition compares state rather than asserting absence.
      - name: Snapshot registry state
        run: .github/scripts/snapshot-registry-state.sh "${RUNNER_TEMP}/registry-before.txt"

      # --- package -------------------------------------------------------
      # Explicitly enumerated, never globbed: edtf-postgres is its own
      # workspace and needs different flags, and a glob is what let it get
      # treated as one of the five and silently skipped at v1.0.0.
      - name: Package all six crates
        run: .github/scripts/package-all.sh

      - name: Assert packaging is deterministic
        run: .github/scripts/assert-deterministic.sh

      - name: Build wasm package
        run: wasm-pack build crates/edtf-wasm --release

      # --- collect the extension tarballs ---------------------------------
      # STRICTLY after the determinism assertion. That step re-runs
      # package-all.sh, which begins `rm -rf dist` — anything placed in dist/
      # before it is deleted silently, and the run would simply proceed with
      # fewer assets than intended.
      #
      # Landing them in dist/ is what wires them into the existing
      # machinery with no new attestation plumbing: `actions/attest` already
      # takes `subject-path: dist/*`, and self-verify-attestations.sh
      # already loops over dist/*. The npm tarball is the precedent —
      # verify-registry-bytes.sh copies it into dist/ for the same reason.
      - name: Collect the extension tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edtf-postgres-pg*
          merge-multiple: true
          path: dist

      - name: Collect the CLI tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edtf-cli-*
          merge-multiple: true
          path: dist

      # One SHA256SUMS over both artifact families; the count assertions
      # inside are what catch a silently missing matrix cell.
      - name: Checksum the binary tarballs
        run: .github/scripts/checksum-artifacts.sh

      # Before the publish, and unguarded: nothing here depends on anything
      # being published, so running it in the rehearsal turns the `cp` loop
      # and cargo-cyclonedx's output layout into a cheap pre-publish
      # failure. The attest steps that CONSUME sbom/*.cdx.json stay where
      # they are, after the proof.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5
          cargo cyclonedx --format json --spec-version 1.5 \
            --manifest-path crates/edtf-postgres/Cargo.toml
          mkdir -p sbom
          # MOVED, not copied. cargo-cyclonedx has no output-directory flag —
          # it always writes beside the manifest — so a copy leaves
          # crates/<name>/<name>.cdx.json behind and the working tree dirty.
          # `cargo publish` then refuses outright: "files in the working
          # directory contain changes that were not yet committed into git".
          # That is what broke v1.1.1, on the first crate, the moment this
          # step was hoisted above the publish so the rehearsal could cover it.
          for name in edtf-core edtf-calendars edtf-normalize edtf-wasm edtf-cli edtf-postgres; do
            mv "crates/${name}/${name}.cdx.json" "sbom/${name}.cdx.json"
          done
          ls -1 sbom/

      # --- rehearsal exit ------------------------------------------------
      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Dry run — nothing published"
            echo
            echo "Provenance this release *would* record:"
            echo
            echo '```'
            echo "ref:       ${GITHUB_REF}"
            echo "gitCommit: ${GITHUB_SHA}"
            echo '```'
            echo
            echo "Artifact digests:"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/digests-2.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Dry-run safety otherwise rests on every publishing step below
      # carrying its `if:` guard — a convention a future edit can forget.
      # This checks the post-condition instead of trusting the convention.
      - name: Assert the rehearsal published nothing
        if: env.DRY_RUN == 'true'
        run: .github/scripts/assert-nothing-published.sh

      # Nothing above may leave the working tree dirty. `cargo publish`
      # refuses to publish from a dirty tree, and it refuses on the FIRST
      # crate — so the failure is safe but total, and it is invisible until
      # a real release reaches this line. v1.1.1 died here. Asserting it
      # explicitly turns "no step writes into the tree" from a convention
      # into a checked precondition, one step before it would matter.
      - name: Assert the working tree is clean
        run: |
          set -euo pipefail
          # UNTRACKED files count. cargo publish rejected v1.1.1 over
          # crates/edtf-core/edtf-core.cdx.json, which was untracked, not
          # modified — so a guard using --untracked-files=no would miss the
          # exact defect it exists to catch. Release staging (dist/, sbom/)
          # is gitignored, so it does not register here.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the working tree is dirty; cargo publish will refuse"
            git status --porcelain
            exit 1
          fi
          echo "::notice::working tree is clean"

      # --- publish -------------------------------------------------------
      # Trusted publishing: short-lived crates.io token via OIDC exchange —
      # no CARGO_REGISTRY_TOKEN secret exists in this repository.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: env.DRY_RUN != 'true'
        id: auth

      # Per-crate guard in dependency order, so a run that dies partway can
      # simply be re-dispatched at the same tag. See the script header.
      - name: Publish all six crates to crates.io
        if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/scripts/publish-crates.sh

      # npm trusted publisher: OIDC, provenance automatic on public packages.
      - name: Publish edtf-wasm to npm
        if: env.DRY_RUN != 'true'
        run: .github/scripts/publish-npm.sh

      # --- prove before signing ------------------------------------------
      # The registry is the thing consumers download. If what it holds is
      # not byte-identical to what this run built, attesting the local files
      # would assert something false — so this fails the release instead.
      - name: Verify registry bytes match local bytes
        if: env.DRY_RUN != 'true'
        run: .github/scripts/verify-registry-bytes.sh

      # --- attest --------------------------------------------------------
      # Subjects are the files THIS run built and just proved identical to
      # the registry's — never a re-download. That distinction is the whole
      # point of issue #54.
      # actions/attest, not actions/attest-build-provenance: as of v4 the
      # latter is a wrapper over this action, and upstream directs new
      # implementations here. Provenance is this action's default predicate.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-provenance
        with:
          subject-path: dist/*

      # cargo-cyclonedx emits one SBOM per package, next to that package's
      # manifest. edtf-postgres needs its own invocation — separate
      # workspace, so the root run does not see it.

      # One SBOM per crate, attested against that crate only. `sbom-path`
      # takes a single file, so a shared step would attach one crate's
      # dependency list to all six — asserting, for example, that
      # edtf-core's (empty) dependency set describes edtf-cli. Enumerated
      # rather than looped because a GitHub Action cannot be run in a shell
      # loop, and silent breakage here is a false SBOM claim.
      #
      # Where a crate also ships binary artifacts, those are subjects of the
      # SAME attestation (issue #83, gap 5): the tarballs are compiled from
      # exactly the dependency closure the crate's SBOM records, and without
      # the binding a consumer verifying a tarball could obtain provenance
      # but no attested dependency list for those bytes. The wasm npm
      # tarball is in dist/ by now — verify-registry-bytes.sh put it there
      # after proving it identical to what the registry serves.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-core
        with:
          subject-path: dist/edtf-core-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-core.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-calendars
        with:
          subject-path: dist/edtf-calendars-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-calendars.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-normalize
        with:
          subject-path: dist/edtf-normalize-${{ env.VERSION }}.crate
          sbom-path: sbom/edtf-normalize.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-wasm
        with:
          subject-path: |
            dist/edtf-wasm-${{ env.VERSION }}.crate
            dist/edtf-wasm-${{ env.VERSION }}.tgz
          sbom-path: sbom/edtf-wasm.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-cli
        with:
          subject-path: |
            dist/edtf-cli-${{ env.VERSION }}.crate
            dist/edtf-cli-${{ env.VERSION }}-*.tar.gz
          sbom-path: sbom/edtf-cli.cdx.json
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        id: attest-sbom-edtf-postgres
        with:
          # Both tarball families: the stripped libraries and their -dbgsym
          # siblings are compiled from the same closure the SBOM records.
          subject-path: |
            dist/edtf-postgres-${{ env.VERSION }}.crate
            dist/edtf_postgres-${{ env.VERSION }}-*.tar.gz
            dist/edtf_postgres-dbgsym-${{ env.VERSION }}-*.tar.gz
          sbom-path: sbom/edtf-postgres.cdx.json

      # --- prove the attestation itself ----------------------------------
      # The check that would have caught v1.0.0 automatically. A passing
      # `gh attestation verify` is NOT sufficient — the v1.0.0 artifacts
      # pass it today while naming the wrong commit. What matters is which
      # ref and commit the provenance records.
      - name: Self-verify attestation ref and commit
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/self-verify-attestations.sh

      # The attestations live in GitHub's attestation store, which is where
      # `gh attestation verify` looks — but a consumer (or Scorecard's
      # Signed-Releases check) inspecting the RELEASE sees nothing signed.
      # Publish the same Sigstore bundles as release assets. Collected via
      # each attest step's bundle-path output, routed through env so no
      # template expands inside run: code (zizmor template-injection).
      - name: Collect attestation bundles
        if: env.DRY_RUN != 'true'
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bundles
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_CORE: ${{ steps.attest-sbom-edtf-core.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_CALENDARS: ${{ steps.attest-sbom-edtf-calendars.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_NORMALIZE: ${{ steps.attest-sbom-edtf-normalize.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_WASM: ${{ steps.attest-sbom-edtf-wasm.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_CLI: ${{ steps.attest-sbom-edtf-cli.outputs.bundle-path }}
          SBOM_BUNDLE_EDTF_POSTGRES: ${{ steps.attest-sbom-edtf-postgres.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p "${BUNDLE_DIR}"
          # The provenance attest covered every dist/* subject in one call,
          # so each release receives a copy of the same bundle; the subjects
          # named inside it are what scope it, not the filename.
          for name in edtf-core edtf-calendars edtf-normalize edtf-wasm edtf-cli edtf-postgres; do
            cp "${PROVENANCE_BUNDLE}" "${BUNDLE_DIR}/${name}-${VERSION}.provenance.intoto.jsonl"
            var="SBOM_BUNDLE_$(tr '[:lower:]-' '[:upper:]_' <<< "${name}")"
            cp "${!var}" "${BUNDLE_DIR}/${name}-${VERSION}.sbom.intoto.jsonl"
          done
          ls -1 "${BUNDLE_DIR}"

      # --- hand off to the finish job ------------------------------------
      # Everything from here down (canaries, asset attachment, publishing
      # the drafts) runs in the `finish` job on a FRESH runner. Paid for
      # three times: v1.2.0 (twice) and v1.2.1 all died of runner memory
      # exhaustion in the canary, after this job's thirty-odd steps — and
      # an OOM-killed runner uploads no logs, so each death was initially
      # unreadable. The tail's only requirements are "after the registry
      # publish, before the drafts publish"; nothing binds it to this
      # runner. The hand-off carries exactly the proven state: dist/ (the
      # attested bytes), sbom/, and the Sigstore bundles — manifested here
      # and re-verified byte-for-byte on the other side, so the artifact
      # store cannot silently become the weak link in the proof chain.
      - name: Manifest the attested state
        if: env.DRY_RUN != 'true'
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bundles
        run: |
          set -euo pipefail
          cp -r "${BUNDLE_DIR}" bundles
          find dist sbom bundles -type f -print0 \
            | xargs -0 sha256sum | sort -k2 > ATTESTED-STATE.sha256
          wc -l ATTESTED-STATE.sha256

      - name: Upload the attested state
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-state
          path: |
            dist/
            sbom/
            bundles/
            ATTESTED-STATE.sha256
          if-no-files-found: error
          # Long enough that a recovery attempted days later still resumes
          # from these bytes instead of a full rebuild.
          retention-days: 7

  # The tail: canaries, asset attachment, publishing the drafts — on a
  # fresh runner (see the hand-off comment in the publish job). Fails and
  # resumes independently: "re-run failed jobs" restarts HERE, consuming
  # the stored attested state, with no rebuild and no re-attestation.
  finish:
    name: Finish — canary, attach, publish (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: publish
    # Hang guard, not a budget: the tail's work is minutes of downloads
    # and API calls plus the canaries.
    timeout-minutes: 45
    permissions:
      contents: write # upload assets to the releases, publish the drafts
    steps:
      # Registries and toolchain hosts for canary.sh; Docker Hub for
      # canary-extension.sh (both blob CDNs — the one-letter-apart lesson).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.18
          # canary.sh needs cargo and npm; nothing here builds from source.
          install_args: rust node
          cache: false

      - name: Resolve version and assert it matches the tag
        run: .github/scripts/resolve-version.sh

      - name: Download the attested state
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-state

      # The artifact store is transport, not a trust boundary — prove the
      # bytes crossing it are the ones the publish job attested, before
      # any of them touch a release.
      - name: Verify the attested state survived transport
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          sha256sum --check --strict --quiet ATTESTED-STATE.sha256
          echo "::notice::attested state verified across the job boundary"

      # --- canary --------------------------------------------------------
      - name: Canary — consume from the registries
        if: env.DRY_RUN != 'true'
        run: .github/scripts/canary.sh

      # Per-crate releases, not the umbrella tag: phase 1 never creates an
      # umbrella release, and each SBOM describes exactly one crate anyway.
      - name: Attach SBOMs to the per-crate releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-sboms.sh

      - name: Attach attestation bundles to the per-crate releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_DIR: bundles
        run: .github/scripts/upload-attestation-bundles.sh

      # Onto the edtf-postgres release, still a draft, alongside its SBOM.
      - name: Attach the extension tarballs
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-extension-assets.sh

      # Onto the edtf-cli release, still a draft. SHA256SUMS goes to both
      # releases — it is the one manifest over all binary artifacts.
      - name: Attach the CLI tarballs
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-cli-assets.sh

      # The stranger's path for the artifacts canary.sh cannot cover:
      # fetch every tarball attached to the draft releases, prove each is
      # what the released SHA256SUMS names, and install one natively.
      - name: Canary — install the released extension tarball
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/canary-extension.sh

      # --- publish the releases ------------------------------------------
      # LAST, and only here: phase 1 cut these as drafts, so nothing has been
      # public until now. Everything above has already run — bytes proved
      # against the registries, attestations verified against the tag, the
      # canary consumed as a stranger, every asset attached. Publishing is
      # the commitment, and immutability makes it permanent, so it happens
      # once there is nothing left that could still fail.
      - name: Publish the per-crate releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-releases.sh

  # The OCI image leg (issue #82; canon: renovate-config templates/publish).
  # Release-driven adaptation of the publish-image skeleton: the image is a
  # PUBLICATION of the released tarballs — built from the release assets by
  # URL with the released SHA256SUMS as the checksum source, never from
  # source — so it inherits the tarballs' proof rather than needing its own
  # build path. Runs strictly after `publish` because the assets it consumes
  # must be public first, and it inherits the tag ref, so its attestation
  # names the release like everything else's.
  #
  # No cosign: the repo's one signing mechanism is GitHub attestations
  # (issue #55 rejected sidecar signatures so there would not be two
  # mechanisms and two sets of instructions), and the #82 checklist asks for
  # attest + push-to-registry, which is what the manifest job does.
  #
  # Skipped entirely on dry runs: a rehearsal has no published assets to
  # build from, and drafts are not fetchable by URL.
  image:
    name: Image pg${{ matrix.pg }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Hang guard, not a budget: observed ~5m per cell (v1.1.2).
    timeout-minutes: 30
    needs: finish
    permissions:
      contents: read # checkout + release asset download
      packages: write # push the per-architecture image by digest
    strategy:
      # One failing cell must not hide the state of the other nine.
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Native hardware per architecture, no QEMU — emulation would
          # test the image on the wrong machine (the publish invariant).
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Routed through env so no template expands inside run: code
      # (zizmor template-injection, pedantic tier).
      PG: ${{ matrix.pg }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/carlallenn/edtf-postgres
    steps:
      # Buildkit's network namespace may not be governed by harden-runner at
      # all — its endpoints (the base pull, the release-asset ADD) are
      # allowlisted anyway rather than relying on that being true (canon:
      # templates/publish egress lore).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            mirror.gcr.io:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        if: env.DRY_RUN != 'true'
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.18
          # Single-purpose job: only the TOML reader that derives the
          # version. No tool cache in the publishing workflow (zizmor
          # cache-poisoning, high).
          install_args: taplo
          cache: false

      - name: Resolve version
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          version=$(taplo get -f crates/edtf-postgres/Cargo.toml 'package.version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # The checksum BuildKit verifies must come from the RELEASE, not this
      # run: the image is the stranger's path, end to end.
      - name: Resolve the released tarball checksum
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/resolve-image-tarball-sha.sh

      # The image's base is a build input to a signed artifact like any
      # other, so it comes from the one digest-pinned table (issue #83,
      # gap 3) rather than a mutable tag resolved at build time.
      - name: Resolve the pinned base image
        if: env.DRY_RUN != 'true'
        env:
          PG: ${{ matrix.pg }}
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/base-images.sh
          . .github/scripts/base-images.sh
          base=$(base_image "${PG}" trixie)
          {
            echo "BASE_IMAGE=${base}"
            # Split here, not in the Dockerfile: a LABEL cannot split a
            # reference, and org.opencontainers.image.base.name/.digest are
            # specified to carry the two halves separately.
            echo "BASE_NAME=${base%@*}"
            echo "BASE_DIGEST=${base#*@}"
          } >> "$GITHUB_ENV"

      # Resolved ONCE and reused by every build below: `created` differing
      # between the test build and the push would make the pushed bytes not
      # the tested bytes, which is the one thing this job exists to prevent.
      - name: Resolve the image metadata labels
        if: env.DRY_RUN != 'true'
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "REVISION=${REVISION}"
          } >> "$GITHUB_ENV"

      # Bootstrap buildkit from Google's Docker Hub mirror: the default pull
      # from Hub's CDN dials past DNS on a hosted runner and is rightly
      # refused by egress block (canon: templates/publish egress lore).
      # Digest-pinned like every other build input (issue #83, gap 3); the
      # custom manager in renovate.json keeps the digest current.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: env.DRY_RUN != 'true'
        with:
          # yamllint disable-line rule:line-length
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded, not pushed: build-push-action's combined build-and-push has
      # no moment where a testable image exists un-published (the publish
      # invariant). No `platforms:` input on purpose — the runner IS the
      # target architecture.
      - name: Build for testing (loaded, not pushed)
        if: env.DRY_RUN != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/edtf-postgres.Dockerfile
          target: runnable
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_NAME=${{ env.BASE_NAME }}
            BASE_DIGEST=${{ env.BASE_DIGEST }}
            PG=${{ matrix.pg }}
            VERSION=${{ env.VERSION }}
            TARBALL_SHA256=${{ env.TARBALL_SHA256 }}
            REVISION=${{ env.REVISION }}
            CREATED=${{ env.CREATED }}
          tags: edtf-postgres:candidate
          load: true

      - name: Smoke-test the candidate
        if: env.DRY_RUN != 'true'
        run: .github/scripts/smoke-image.sh edtf-postgres:candidate

      # A scratch image cannot be booted, so the artifact stage is proved
      # through the `verify` target: the documented COPY --from, into a
      # stock postgres, smoked like any other image. Resolves the shared
      # `extract` stage from the build above rather than re-fetching — one
      # ADD, one checksum verification, so the artifact and runnable images
      # cannot ship different extension bytes.
      - name: Build the artifact verifier (loaded, not pushed)
        if: env.DRY_RUN != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/edtf-postgres.Dockerfile
          target: verify
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PG=${{ matrix.pg }}
            VERSION=${{ env.VERSION }}
            TARBALL_SHA256=${{ env.TARBALL_SHA256 }}
            REVISION=${{ env.REVISION }}
            CREATED=${{ env.CREATED }}
          tags: edtf-postgres:artifact-verify
          load: true

      - name: Smoke-test the artifact variant through its consumer
        if: env.DRY_RUN != 'true'
        run: .github/scripts/smoke-image.sh edtf-postgres:artifact-verify

      # Same builder, same inputs: this resolves from the in-job build above
      # rather than rebuilding, so the published bytes are the tested bytes.
      - name: Push by digest
        if: env.DRY_RUN != 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/edtf-postgres.Dockerfile
          target: runnable
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_NAME=${{ env.BASE_NAME }}
            BASE_DIGEST=${{ env.BASE_DIGEST }}
            PG=${{ matrix.pg }}
            VERSION=${{ env.VERSION }}
            TARBALL_SHA256=${{ env.TARBALL_SHA256 }}
            REVISION=${{ env.REVISION }}
            CREATED=${{ env.CREATED }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # mode=max, not the default min: min records no materials, so the
          # resolved base image digest appears nowhere in the attestation.
          # Every build arg here is non-secret (the tarball checksum is
          # published in the release's SHA256SUMS), so embedding the full
          # input set costs nothing and makes the base auditable per image.
          provenance: mode=max
          sbom: true

      # Same builder and the same resolved `extract` stage as the artifact
      # candidate smoked above, for the same reason the runnable push
      # resolves from its own test build.
      - name: Push the artifact variant by digest
        if: env.DRY_RUN != 'true'
        id: push-artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/edtf-postgres.Dockerfile
          target: artifact
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PG=${{ matrix.pg }}
            VERSION=${{ env.VERSION }}
            TARBALL_SHA256=${{ env.TARBALL_SHA256 }}
            REVISION=${{ env.REVISION }}
            CREATED=${{ env.CREATED }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Record the digests
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARTIFACT_DIGEST: ${{ steps.push-artifact.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests artifact-digests
          echo "${DIGEST}" > "digests/pg${PG}-${ARCH}"
          echo "${ARTIFACT_DIGEST}" > "artifact-digests/pg${PG}-${ARCH}"

      - name: Publish the digest for the manifest job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: digests/pg${{ matrix.pg }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      # A distinct artifact-name prefix, not a suffix: the manifest job
      # globs `image-digest-pg<major>-*`, which a suffixed name would be
      # swept into, silently folding four digests into one manifest list.
      - name: Publish the artifact digest for the manifest job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-artifact-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: artifact-digests/pg${{ matrix.pg }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # One manifest list per postgres major, under a single tag — two
  # arch-suffixed tags is the common wrong answer and breaks `docker run`
  # on arm (the #82 checklist). Tagging policy: extension version × pg
  # major (`1.1.2-pg18`) plus the floating major tag (`pg18`) consumers
  # watch for digest updates; everything downstream pins the digest.
  image-manifest:
    name: Image manifest pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~2m per major (v1.1.2).
    timeout-minutes: 20
    needs: image
    permissions:
      contents: read # checkout + attestation verify
      packages: write # push the manifest list
      id-token: write # OIDC: sign the attestation
      attestations: write # store it
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    env:
      PG: ${{ matrix.pg }}
      IMAGE: ghcr.io/carlallenn/edtf-postgres
    steps:
      # tuf-repo.github.com + tmaproduction.blob.core.windows.net: the
      # stranger's `gh attestation verify` fetches GitHub's TUF trust root
      # and its target store — absent, every artifact reports "provenance
      # does not match" while the real error stays invisible (issue #66).
      # mirror.gcr.io doubles as trivy's DB source.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mirror.gcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve dry-run mode
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: .github/scripts/resolve-dry-run.sh

      - name: Assert publishing ref
        run: .github/scripts/assert-publish-ref.sh

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        if: env.DRY_RUN != 'true'
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.18
          # taplo derives the version; trivy runs the report-only scan.
          install_args: taplo aqua:aquasecurity/trivy
          cache: false

      - name: Resolve version
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          version=$(taplo get -f crates/edtf-postgres/Cargo.toml 'package.version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: env.DRY_RUN != 'true'
        with:
          # yamllint disable-line rule:line-length
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect this major's per-architecture digests
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-pg${{ matrix.pg }}-*
          merge-multiple: true
          path: digests

      - name: Collect this major's per-architecture artifact digests
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-artifact-pg${{ matrix.pg }}-*
          merge-multiple: true
          path: artifact-digests

      - name: Create and push the manifest list
        if: env.DRY_RUN != 'true'
        id: manifest
        run: |
          set -euo pipefail
          digest=$(.github/scripts/push-image-manifest.sh digests \
            "${VERSION}-pg${PG}" "pg${PG}")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # Tagged in parallel with the runnable list: `<version>-pg<major>` is
      # the immutable reference consumers pin, `pg<major>` the floating one
      # that tracks the latest release for that major (it is NOT rebuilt
      # between releases — see issue #147).
      - name: Create and push the artifact manifest list
        if: env.DRY_RUN != 'true'
        id: manifest-artifact
        run: |
          set -euo pipefail
          digest=$(.github/scripts/push-image-manifest.sh artifact-digests \
            "${VERSION}-pg${PG}-artifact" "pg${PG}-artifact")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # Prove the PUBLISHED bytes, not a local twin: pull the manifest back
      # by digest (this runner resolves its amd64 leg) and boot it. Both
      # architectures were smoke-tested pre-push on native hardware; this
      # re-proof covers the publish step itself, one leg sufficing for the
      # same reason canary-extension.sh re-fetches one asset.
      - name: Pull the published image back and smoke it
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          .github/scripts/smoke-image.sh "${IMAGE}@${DIGEST}"

      # The artifact list gets the same treatment through its consumer: the
      # per-architecture legs were proved pre-push on native hardware, and
      # this re-proof covers the publish step for the variant the README
      # tells people to consume.
      - name: Resolve the pinned base image
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/base-images.sh
          . .github/scripts/base-images.sh
          echo "BASE_IMAGE=$(base_image "${PG}" trixie)" >> "$GITHUB_ENV"

      - name: Build the COPY --from consumer of the published artifact
        if: env.DRY_RUN != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/edtf-postgres-consumer.Dockerfile
          build-args: |
            ARTIFACT_IMAGE=${{ env.IMAGE }}@${{ steps.manifest-artifact.outputs.digest }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PG=${{ matrix.pg }}
          tags: edtf-postgres:published-artifact-consumer
          load: true

      - name: Smoke the published artifact through its consumer
        if: env.DRY_RUN != 'true'
        run: .github/scripts/smoke-image.sh edtf-postgres:published-artifact-consumer

      # Report-only: the CVE gate belongs on pull requests, never on the
      # publish path (canon: templates/trivy) — a CVE published tomorrow
      # must not retroactively kill a release. The scan exists so every
      # published digest has its package-CVE state on the run log.
      #
      # Kept deliberately now that the runnable image is documented as a
      # convenience rather than a supported artifact (issue #147): a
      # convenience whose posture is unrecorded is how it quietly becomes a
      # supported artifact again. This log IS the record — it is what made
      # that decision answerable rather than a guess, and it is where the
      # README's "expect base-inherited CVEs between releases" gets its
      # evidence, per release, without a gate that could block one.
      #
      # Both variants, for the same reason: the artifact image's claim to
      # no inherited CVE surface is structural, but a scan reporting it
      # each release is cheap and turns the claim into an observation.
      - name: Scan the published images (report-only)
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          ARTIFACT_DIGEST: ${{ steps.manifest-artifact.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "${DIGEST}" "${ARTIFACT_DIGEST}"; do
            trivy image --config /dev/null --scanners vuln \
              --exit-code 0 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              "${IMAGE}@${d}"
          done

      # Attested the same way as everything else in this repository —
      # GitHub attestations, no cosign sidecar (issue #55): subject-name is
      # the untagged image, and push-to-registry stores the attestation
      # where docker/gh tooling discovers it.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        with:
          subject-name: ghcr.io/carlallenn/edtf-postgres
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # Its own invocation, not a second subject on the one above: the two
      # manifest lists are separate published digests, and a consumer
      # verifying `-artifact` must get an attestation naming that digest.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: env.DRY_RUN != 'true'
        with:
          subject-name: ghcr.io/carlallenn/edtf-postgres
          subject-digest: ${{ steps.manifest-artifact.outputs.digest }}
          push-to-registry: true

      # Verify the way a stranger would, immediately: an attest step that
      # succeeded is not the same as an attestation that verifies against
      # the identity consumers will check.
      #
      # A script, not inline: SECURITY.md publishes this command, and the
      # documented one and the executed one must not be able to drift
      # (issue #159).
      - name: Verify the attestations as a consumer would
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          ARTIFACT_DIGEST: ${{ steps.manifest-artifact.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/verify-image-attestation.sh \
            "${IMAGE}@${DIGEST}" "${IMAGE}@${ARTIFACT_DIGEST}"
