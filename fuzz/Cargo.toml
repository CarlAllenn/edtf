[package]
name = "edtf-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Lint canon: renovate-config templates/rust-lints/Cargo-lints.toml —
# mirrored from the main workspace (this manifest is its own workspace, so
# it cannot inherit). Keep the three blocks in lockstep.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
single_use_lifetimes = "warn"
explicit_outlives_requirements = "warn"
rust-2024-compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"


[dependencies]
libfuzzer-sys = "0.4"
edtf-core = { path = "../crates/edtf-core" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
