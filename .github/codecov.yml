---
# Codecov is visibility only, and this file is what keeps it that way.
#
# The coverage job in ci.yml is titled "visibility, no threshold" on purpose:
# a number that gates merges gets gamed rather than improved, so drops are
# reviewed by humans (issue #8). Codecov's defaults contradict that — it
# posts `codecov/project` and `codecov/patch` commit statuses against an
# auto-computed target, which is a merge-blocking threshold in everything but
# name. Both are off below. What survives is the badge and the PR comment:
# the number, published, for a person to read.
coverage:
  status:
    project: 'off'
    patch: 'off'

# There is deliberately no `ignore:` list.
#
# There used to be one, for crates/edtf-postgres/**, justified by the claim
# that llvm-cov could not instrument the pgrx harness. That claim was false
# (issue #153): the Postgres backend processes emit .profraw like any other
# instrumented binary. What was true is that the coverage job had no Postgres
# to run those tests against — so the extension is now measured in the
# postgres matrix job, which does, and the coverage job uploads both that
# fragment and its own export. Every crate in the workspace reaches Codecov.
#
# If a future change stops producing lcov-postgres.info, the right outcome is
# for Codecov to report the gap, not to be told in advance that it isn't one.
