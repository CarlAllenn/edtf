[package]
name = "edtf-wasm"
version = "1.2.0"
readme = "README.md"
description = "WebAssembly bindings for edtf-core and edtf-normalize: EDTF (ISO 8601-2) validation and prose-date normalization for JavaScript."
keywords = ["edtf", "date", "iso8601", "wasm", "javascript"]
categories = ["date-and-time", "wasm", "web-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
edtf-core = { workspace = true, features = ["serde"] }
edtf-normalize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
