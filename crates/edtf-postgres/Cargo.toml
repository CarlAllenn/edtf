[package]
name = "edtf-postgres"
version = "0.2.0"
description = "Postgres extension (pgrx) exposing edtf-core: EDTF validation, levels, canonical form and date bounds in SQL."
keywords = ["edtf", "date", "iso8601", "postgres", "pgrx"]
categories = ["date-and-time", "database"]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlAllenn/edtf"

# Deliberately its own workspace: pgrx extensions need an independent
# dependency graph and a locally-initialized pgrx toolchain.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
edtf-core = { path = "../edtf-core", version = "0.2.0" }
pgrx = "0.19.1"

[dev-dependencies]
pgrx-tests = "=0.19.1"

[package.metadata.cargo-machete]
# pgrx-tests has no direct `use`: `cargo pgrx test` links it as the test
# harness, wired through the per-pg feature flags above.
ignored = ["pgrx-tests"]

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
