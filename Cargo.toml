[workspace]
resolver = "2"
members = ["crates/edtf-core"]
# Wrapper crates join the workspace once the core is real:
#   crates/edtf-wasm      (wasm-bindgen wrapper for the app)
#   crates/edtf-postgres  (pgrx extension for the DB)

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarlAllenn/edtf"
