[package]
name = "edtf-cli"
version = "1.1.2"
readme = "README.md"
description = "Command-line EDTF (ISO 8601-2) validator: validate, canonicalize, level, bounds, temporal relations and Julian (Old Style) conversion."
keywords = ["edtf", "date", "iso8601", "cli", "validator"]
categories = ["command-line-utilities", "date-and-time"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "edtf"
path = "src/main.rs"

[dependencies]
edtf-core = { workspace = true }
edtf-calendars = { workspace = true }
serde_json = { workspace = true }
