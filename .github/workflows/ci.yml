---
name: CI

"on":
  push:
    # renovate/**: branch-automerge needs the CI check on the branch itself
    # (no PR is opened unless the branch goes red).
    branches: [main, renovate/**]
  pull_request: {}
  schedule:
    # Weekly full gate on main: cargo-deny's advisories check has an input —
    # the RustSec database — that changes without commits; this catches new
    # advisories during quiet weeks. Fingerprinted gates restore the .task
    # cache from the last green run and skip.
    - cron: 0 6 * * 1

permissions:
  contents: read

# A newer push to the same branch supersedes any run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + test (workspace)
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~1.5m.
    timeout-minutes: 15
    env:
      # Heavy source-built tools this job never invokes.
      MISE_DISABLE_TOOLS: cargo:cargo-pgrx,cargo:cargo-fuzz,aqua:rustwasm/wasm-pack
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
      # The rustup-init pin (version + two SHA256s) in the extension build
      # script must agree with rust-lang's published checksums. Renovate
      # bumps the version line only, so this is what turns a bump with
      # stale checksums into a red PR instead of a publish-path failure.
      - name: Verify the rustup-init pin
        run: .github/scripts/verify-rustup-pin.sh
      # go-task fingerprints (Taskfile `sources:`): a hit means a gate's
      # inputs are byte-identical to a run that already passed, so it skips.
      # go-task only writes checksums after a task succeeds, and
      # actions/cache only saves on green jobs, so a failing gate can never
      # be cached green; on restore, task re-verifies every checksum against
      # the actual sources, so a stale entry simply re-runs.
      - name: Cache task fingerprints
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .task
          key: task-fingerprints-${{ github.sha }}
          restore-keys: task-fingerprints-
      # Pinned nightly rustfmt (Taskfile RUSTFMT_TOOLCHAIN — the second
      # sanctioned nightly exception; templates/rustfmt/README.md).
      - run: task fmt:toolchain
      # zizmor runs offline everywhere (deterministic gates); its online
      # audits move to the scanner baseline (renovate-config issue #7).
      - run: task ci

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~15s.
    timeout-minutes: 10
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # The action pulls its docker image from Docker Hub; blob serving
          # picks between cloudflare and cloudfront per request (same lore
          # as publish.yml).
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            auth.docker.io:443
            registry-1.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every file carries SPDX info: .rs/.sh via in-file headers (PR #101),
      # everything else via REUSE.toml. The fsfe action is the canonical
      # `reuse lint` runner — no toolchain, one docker image.
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secrets:
    name: gitleaks history scan
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~15s.
    timeout-minutes: 10
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # gitleaks itself makes no network calls; minimal cold-cache
          # set for the gitleaks-only install (see install_args below).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the scan re-applies the pinned ruleset to every
          # commit, not just the tip (templates/gitleaks/README.md).
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Scanner jobs install only their own tools — the history scan
          # must not pay (or egress for) the whole toolchain.
          install_args: gitleaks task
      - run: task scan:secrets

  semver:
    name: cargo-semver-checks (published crates)
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~1m.
    timeout-minutes: 15
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # crates.io set: the baseline is fetched from the registry
          # (templates/cargo-semver-checks/README.md), plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Scanner jobs install only their own tools.
          install_args: rust github:obi1kenobi/cargo-semver-checks task
      - run: task semver

  msrv:
    # Stable job name: it is a required status check on main, and a name
    # that embeds the version would break branch protection on MSRV bumps.
    #
    # The MSRV toolchain is a sanctioned exception to the everything-via-mise
    # rule: it is deliberately a second rustup toolchain, bumped manually.
    # The version lives only in Cargo.toml rust-version — derived below,
    # never duplicated.
    name: MSRV check
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~30s.
    timeout-minutes: 10
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: taplo
      - name: Derive MSRV from Cargo.toml
        run: echo "MSRV=$(taplo get -f Cargo.toml 'workspace.package.rust-version')" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup run "$MSRV" cargo check --all-features

  wasm:
    name: WebAssembly build + native tests
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~45s.
    timeout-minutes: 15
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # wasm32-unknown-unknown rides the rust pin in mise.toml (targets=).
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: rust
      - run: cargo test -p edtf-wasm
      - run: cargo build -p edtf-wasm --target wasm32-unknown-unknown --release

  postgres:
    name: pgrx extension tests (Postgres ${{ matrix.pg }})
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed 6.5-7.1m per major, up from ~3.5m
    # before this job took on the instrumented coverage run (a nightly
    # toolchain install and an instrumented rebuild). Roughly double, and still
    # a third of the guard.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    env:
      # cargo-pgrx is pinned in mise.toml (cargo backend, compiled from
      # source); this job carries its own mise cache so the compile is
      # amortized separately from the lint jobs' cache.
      # Routed through env so no template expands inside run: code
      # (zizmor template-injection, pedantic tier).
      PG: ${{ matrix.pg }}
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      #
      # Derived from the audit run plus the GitHub-owned cold-cache set
      # (mise tool installs on cache miss). sudo stays on: cargo pgrx init
      # needs apt packages.
      #
      # ftp.postgresql.org and www.postgresql.org are reached only on a
      # ~/.pgrx cache MISS, when `cargo pgrx init --pgN download` fetches
      # versions.rss and the Postgres tarball. A warm cache short-circuits
      # the init step entirely, which is why an egress audit never observed
      # those two.
      #
      # Keep prose ABOVE the step: `allowed-endpoints:` is a folded block
      # scalar and does not strip `#`, so comments written inside it become
      # part of the value and are parsed as hostnames.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            codeload.github.com:443
            crates.io:443
            dl.google.com:443
            esm.ubuntu.com:443
            ftp.postgresql.org:443
            www.postgresql.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            packages.microsoft.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            security.ubuntu.com:80
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md). cargo-llvm-cov and task are here because
          # this job now measures its own coverage — see the test step below.
          install_args: rust cargo:cargo-pgrx aqua:taiki-e/cargo-llvm-cov task
          # v1 -> v2 because the tool set above changed. A cache hit skips the
          # save, so leaving the key alone would mean re-installing the two new
          # tools on every run, for the life of the cache.
          cache_key_prefix: mise-pgrx-v2
      - name: Resolve pinned cargo-pgrx version
        run: echo "PGRX_VERSION=$(cargo pgrx --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Cache pgrx-managed Postgres
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pgrx
          key: pgrx-${{ env.PGRX_VERSION }}-pg${{ matrix.pg }}-${{ runner.os }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libreadline-dev zlib1g-dev
      - run: >
          grep -q "pg$PG" ~/.pgrx/config.toml 2>/dev/null ||
          cargo pgrx init "--pg$PG" download
      # edtf-postgres is not a default member, so the workspace clippy gate
      # does not reach it — and it cannot: linting needs the Postgres
      # toolchain this job initialises, and `--all-features` over its
      # mutually-exclusive pg14-pg18 features is a hard error. Same tier as
      # everywhere else, warnings denied.
      - run: >
          cargo clippy -p edtf-postgres --all-targets
          --no-default-features --features "pg$PG" -- -D warnings
      # Same pair the coverage job installs: llvm-tools on the active
      # toolchain, and `task coverage:pg` pulls in the pinned nightly itself
      # (its coverage:toolchain dep) because `--branch` is nightly-only.
      - run: rustup component add llvm-tools
      # The test run, instrumented — this IS `cargo pgrx test`, wrapped so the
      # backend processes emit .profraw (issue #153). It replaces the plain run
      # rather than following it: instrumentation changes speed, not semantics,
      # and this is the matrix's most expensive step, five times over.
      #
      # edtf-postgres used to sit outside the coverage metric because the
      # coverage job installs neither cargo-pgrx nor a Postgres. Measuring it
      # in the job that already has both is what folds it in, and does it
      # without the coverage job giving up `disable-sudo: true` or paying for a
      # second pgrx build.
      #
      # Every leg, not just the exporting one: the script asserts its own union
      # is clean, so "no uncovered line, no untaken branch side" is checked
      # against all five majors continuously rather than measured once on pg18
      # and assumed. The recipe lives in Taskfile.yml and the script, so it is
      # identical here and under `task coverage:pg`.
      - run: task coverage:pg
      # pg18 governs, for the SQL snapshot's reason: it is the default feature.
      # One fragment, not five — concatenating all five would make a line the
      # pg14 leg covers and the pg18 leg does not read as uncovered, because
      # the union gate reads every section it is given.
      - name: Upload extension coverage fragment
        if: matrix.pg == 18
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-postgres
          path: |
            lcov-postgres.info
            coverage-postgres.txt
      # One leg only: the snapshot is the crate's SQL contract, and the
      # point is that there is a single canonical copy of it. pg18 is the
      # default feature, so it is the one that governs. Running this on all
      # five legs would demand five snapshots and answer a different,
      # less useful question.
      - name: SQL surface snapshot
        if: matrix.pg == 18
        run: .github/scripts/schema-snapshot.sh
      # The release publishes edtf-postgres with --no-verify, because the
      # verify build runs pgrx's build script and needs a $PGRX_HOME the
      # release runner does not have. This job DOES have one, so the check
      # lives here instead of being skipped everywhere: it proves the
      # packaged tarball — not just the working tree — actually builds.
      # Without it, --no-verify would be an assumption rather than a
      # delegation (issue #54).
      #
      # Same feature selection as the test step above, so every leg verifies
      # packaging against the Postgres it initialised. Left on defaults this
      # would build pg18 on all five legs and fail everywhere but one.
      # Packaged alongside edtf-core, not alone: packaging a crate strips its
      # path dependencies and resolves them from the registry instead. On a
      # release PR the bumped version is not published yet, so packaging
      # edtf-postgres by itself fails with "failed to select a version for
      # the requirement `edtf-core = ^1.0.1`". Naming both makes cargo build
      # a temporary registry from the sibling and resolve against that.
      #
      # The real publish never hits this — publish-crates.sh puts edtf-core
      # on crates.io before edtf-postgres — but this check must pass on the
      # release PR that creates the version, which is exactly when it cannot
      # be resolved remotely.
      - name: Verify the packaged crate builds
        run: >
          cargo package -p edtf-core -p edtf-postgres
          --no-default-features --features "edtf-postgres/pg$PG"

  docs:
    name: rustdoc (warnings are errors) + doc tests
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~1m.
    timeout-minutes: 15
    env:
      MISE_DISABLE_TOOLS: cargo:cargo-pgrx,cargo:cargo-fuzz,aqua:rustwasm/wasm-pack
      # The docs.rs page is a shipped artifact: broken intra-doc links and
      # invalid doc code are release defects, not warnings.
      RUSTDOCFLAGS: -D warnings
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: rust
      - run: cargo doc --all-features --no-deps
      - run: cargo test --all-features --doc

  coverage:
    name: Coverage (visibility, no threshold)
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~1m.
    timeout-minutes: 15
    # The extension's half of the measurement is produced by the postgres job,
    # which owns the pgrx harness those tests run in (issue #153). This job is
    # the merge-and-publish half, so it waits for it.
    #
    # The cost is deliberate and it is two things. Coverage now lands after the
    # matrix rather than beside it, and a red postgres leg means no coverage
    # report at all — which is the honest outcome: a matrix that did not finish
    # has not measured anything, and a number published anyway would be a
    # smaller number wearing the same badge.
    needs: postgres
    permissions:
      contents: read
      id-token: write # OIDC: Codecov upload, so no CODECOV_TOKEN secret exists
    env:
      MISE_DISABLE_TOOLS: cargo:cargo-pgrx,cargo:cargo-fuzz,aqua:rustwasm/wasm-pack
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss). The codecov.io
          # hosts and keybase.io are the upload path: the action fetches the
          # Codecov CLI from cli.codecov.io and verifies its GPG signature
          # against keybase.io, then the CLI POSTs to ingest.codecov.io and
          # PUTs the report to the presigned storage URL that hands back.
          #
          # ingest.codecov.io is the host the CLI actually talks to, observed
          # in the harden-runner log — not api.codecov.io, which the first cut
          # of this job guessed and which is never resolved.
          # storage.googleapis.com is the second leg, and the first successful
          # upload confirmed it rather than assuming it: the CLI negotiates
          # with ingest, then PUTs the report to the presigned storage URL it
          # hands back. Both are load-bearing; all four hosts here are
          # observed, none are guessed.
          allowed-endpoints: >
            api.github.com:443
            cli.codecov.io:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            ingest.codecov.io:443
            keybase.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: rust aqua:taiki-e/cargo-llvm-cov task
      - run: rustup component add llvm-tools
      # One instrumented run, reported three ways below: the per-file table
      # into the step summary, lcov.info for Codecov, and the union count that
      # gates. The commands live in Taskfile.yml so the measurement is
      # identical locally and here, and so the nightly pin and the
      # edtf-postgres exclusion are each written down once.
      #
      # `--branch` is nightly-only, so this runs the same pinned nightly
      # rustfmt uses — the repo carries one nightly, not two. That is a change
      # from the stable, lines-only measurement this job used to do: branch
      # sides were previously measurable only on a contributor's laptop, which
      # made half of issue #106's exit criterion unobservable in CI.
      - run: task coverage
      # The other half of the measurement. `cargo llvm-cov report` cannot
      # render this crate here — the profile data was produced by Postgres
      # backend processes on another runner — so the fragment arrives already
      # exported, as lcov plus its own rendered table.
      #
      # No `continue-on-error`, and nothing downstream tolerates the file being
      # absent: download-artifact fails when the artifact does not exist, and
      # that failure is the only thing standing between "the extension is in
      # the number" and a silent return to the gap this replaced.
      - name: Download the extension coverage fragment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-lcov-postgres
      - name: Coverage summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            task -s -o interleaved coverage:table
            cat coverage-postgres.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The table above under-reports edtf-core's four largest modules. A lib
      # with both integration tests and inline `#[cfg(test)]` tests is compiled
      # twice — plain rlib, and `--cfg test` — and llvm-cov records those
      # separately: bounds.rs carries two records for one branch,
      # `Branch (125:13): [True: 2.19k, False: 0]` from the rlib and
      # `[True: 0, False: 1]` from the unit-test build. The per-file summary
      # reports the best single instantiation rather than the union, so a file
      # reads 100% only when one build covers it alone — which is why the small
      # crates are unaffected and bounds/display/enumerate/parser are not.
      # docs/coverage.md carries the evidence.
      #
      # "Was this line ever executed by the suite" is the union, and the
      # per-line DA:/BRDA: records carry it. So the union is what gates, and
      # the table's shortfall can never be mistaken for a real gap — nor
      # "fixed" by deleting a guard test (issue #106, docs/coverage.md).
      #
      # This IS a gate, and it does not contradict issue #8's rejection of
      # coverage thresholds: "≥ N%" is a number that rots into gaming, while
      # "no uncovered line, no untaken branch side" is a binary invariant that
      # cannot be half-satisfied. The percentage is still published, still
      # ungated, and still read by a human.
      #
      # It runs last, after the artifact and the Codecov upload, so a failing
      # gate still leaves the lcov to diagnose it with — the run where the
      # number matters most is exactly the one that must not lose the data.
      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: |
            lcov.info
            lcov-postgres.info
      # Publication, not a gate. .github/codecov.yml turns off the project
      # and patch commit statuses Codecov posts by default — those are the
      # merge-blocking threshold the comment above rejects, wearing a
      # different hat. What is left is the README badge and the PR comment.
      #
      # Fork PRs get no OIDC token; the action detects the fork and skips the
      # upload rather than failing. fail_ci_if_error stays false for the same
      # reason this job is not a gate: a Codecov outage must not redden a PR
      # that has nothing to do with coverage. The cost of that choice is that
      # a persistently failing upload is quiet — this step's own log is where
      # it shows.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          # Both halves. Codecov merges multiple reports for a commit, so the
          # badge and the PR comment carry one number over the whole workspace
          # rather than one over most of it.
          files: lcov.info,lcov-postgres.info
          # Report exactly the files the steps above produced; no tree scan.
          disable_search: true
          codecov_yml_path: .github/codecov.yml
          fail_ci_if_error: false
          # The CLI reports crashes to Codecov's Sentry. The egress policy
          # blocks it either way; turning it off at source means the audit log
          # records the upload path and nothing else.
          disable_telem: true
      # The gate, last: see the reasoning above the artifact upload.
      #
      # The counts go to the log as well as the step summary. Redirecting them
      # only into $GITHUB_STEP_SUMMARY leaves a failing gate with no numbers
      # in the log, which is precisely the run where they are wanted. Capture
      # rather than pipe: the default shell here is `bash -e` without
      # pipefail, so `task ... | tee` would report tee's status and a red gate
      # would pass.
      - name: Union view — every line executed, every branch side taken
        run: |
          out=$(task -s -o interleaved coverage:check 2>&1) && status=0 || status=$?
          {
            echo '## Coverage (union view)'
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"
          exit "$status"
