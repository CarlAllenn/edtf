---
# Canonical scheduled-scanners workflow (issue #7). Copy-template: keep
# the shape, adapt nothing unless the repo has extra scheduled-class
# scanners. These jobs are the never-fingerprint class — their inputs
# (the GitHub API's advisory/repo state, the public internet) change
# without commits — so they run on a weekly cron and never gate pushes.
# The deterministic siblings live in ci.yml. Decision records:
# README.md in this directory.
name: scheduled

"on":
  schedule:
    # Offset one hour from ci.yml's weekly full gate so the runs don't
    # contend and a shared-cause failure is distinguishable by timing.
    - cron: 0 7 * * 1
  # Manual kick: triage, allowlist derivation, post-fix re-runs.
  workflow_dispatch: {}

permissions:
  contents: read

# Queue, don't cancel: every completed scanner run is a useful result (the
# same rationale as fuzz-style workflows), and overlap is only possible via
# a manual dispatch during the weekly run.
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zizmor-online:
    name: zizmor online audits
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~30s.
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Minimal cold-cache set: this job installs only zizmor (see
          # install_args below), so none of the toolchain domains apply.
          # api.github.com also serves the online audits themselves.
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0          # Scanner jobs install only their own tool — a scheduled scanner
          # must not pay (or egress for) the whole toolchain.
          install_args: aqua:zizmorcore/zizmor

      # The six online audits (known-vulnerable-actions, stale-action-refs,
      # ref-confusion, typosquat-uses, archived-uses, impostor-commit) run
      # ONLY here: every commit/CI gate is `zizmor --offline` because
      # advisory lookups are time-varying. This job is their home (issue #4
      # handoff). Same pedantic persona and .github/ scope as the gates.
      - name: zizmor (online)
        run: zizmor --persona=pedantic .github/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~30s.
    timeout-minutes: 10
    permissions:
      contents: read # analyze the repository
      id-token: write # OIDC: proves to the OpenSSF API these results are ours
    steps:
      # Audit, not block — same quarantine rationale as lychee below, and
      # the same path every other allowlist in this repo took: the enforced
      # lists were "derived from the audit run". Scorecard queries a wide
      # and undocumented set of hosts (OpenSSF, OSV, best-practices, the
      # GitHub API), so the allowlist gets read off the first live run
      # rather than guessed at here. Nothing secret-bearing runs in this
      # job; the token is read-only plus a scoped OIDC exchange.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # publish_results puts the score behind the README badge and replaces
      # the OpenSSF team's own weekly scan of this repo with our run.
      # Scheduled runs only ever execute on the default branch, which is
      # what publishing requires.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: true

  links:
    name: lychee
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~1m; lychee is network-bound.
    timeout-minutes: 15
    steps:
      # audit, not block — the only such job in any workflow. A link
      # checker's purpose is arbitrary egress; a meaningful allowlist would
      # be the link list itself. Quarantined here so every ci.yml job keeps
      # egress-policy: block; nothing secret-bearing runs in this job (the
      # default read-only token only authenticates github.com link checks).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0          # Scanner jobs install only their own tool — a scheduled scanner
          # must not pay (or egress for) the whole toolchain.
          install_args: lychee

      # Config: lychee.toml at the repo root (canon: templates/lychee/).
      - name: lychee
        run: lychee .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The one claim this repository shipped without a proof behind it (issue
  # #158): the artifact image's CloudNativePG ImageVolume layout. Scheduled
  # rather than gating, for the reasons in smoke-cnpg.sh's header — an
  # external operator, a Kubernetes floor, and a PUBLISHED image it cannot
  # run without. Those are exactly the inputs that break with no commit
  # here, which is the definition of this workflow's job class.
  cnpg:
    name: CloudNativePG ImageVolume
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~4m locally against a warm cache,
    # and the CI path adds three cold image pulls to that.
    timeout-minutes: 30
    # Job-scoped, not step-scoped: this is what makes mise.cnpg.toml visible
    # at all, and mise's shims re-read it on every invocation — so the step
    # that RUNS kind needs it just as much as the step that installs kind.
    # kind and kubectl are pinned there rather than in mise.toml so that
    # `task ci`, which installs the whole toolchain under `egress-policy:
    # block`, never reaches for dl.k8s.io. See that file's header.
    env:
      MISE_ENV: cnpg
    steps:
      # audit, not block — the second such job, and for a structural reason
      # rather than lychee's wide-endpoint one. A kind node is a container
      # running its own containerd with its own resolver, and every image
      # this proof depends on (operator, operand, extension) is pulled from
      # inside it. A runner-level allowlist cannot see or filter that
      # traffic, so declaring `block` here would assert a control that is
      # not in force — worse than declaring none. Quarantined here with
      # nothing secret-bearing in the job: the read-only default token
      # authenticates one release lookup, and every image pulled is public,
      # and digest-pinned in smoke-cnpg.sh.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Its own tools and no others, the same rule as the scanners
          # above: a scheduled job must not pay (or egress for) the whole
          # toolchain. Neither pin is arbitrary — see smoke-cnpg.sh on why
          # the kind floor is load-bearing.
          install_args: kind kubectl

      # The LATEST PUBLISHED release, not the workspace version: main is
      # routinely ahead of what has shipped, and an image only exists for
      # what shipped. Sorted by publish time rather than trusting list
      # order, because five tags are cut per release and only one of them
      # names the extension.
      - name: Resolve the published artifact image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("edtf-postgres-v"))]
                  | sort_by(.publishedAt) | last | .tagName // ""')
          if [[ -z ${tag} ]]; then
            echo "::error::no edtf-postgres release found to test"
            exit 1
          fi
          version="${tag#edtf-postgres-v}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=ghcr.io/carlallenn/edtf-postgres:${version}-pg18-artifact" >> "${GITHUB_ENV}"
          echo "::notice::testing ${tag}"

      - name: Mount the artifact image into a CNPG cluster and prove it loads
        run: .github/scripts/smoke-cnpg.sh "${IMAGE_REF}"
