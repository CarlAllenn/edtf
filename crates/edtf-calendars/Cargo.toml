[package]
name = "edtf-calendars"
version = "0.1.0"
description = "Proleptic Julian (Old Style) to Gregorian conversion at the EDTF ingest boundary. Deterministic arithmetic, no_std, zero dependencies."
keywords = ["edtf", "julian", "gregorian", "calendar", "no-std"]
categories = ["date-and-time", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
edtf-core = { path = "../edtf-core", version = "0.2.0" }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }

[features]
serde = ["dep:serde", "edtf-core/serde"]

[dev-dependencies]
# Same pinned std-only subset as edtf-core's property tests.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
