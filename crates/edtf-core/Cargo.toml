[package]
name = "edtf-core"
version = "0.2.0"
description = "EDTF (ISO 8601-2:2019 Annex A) parsing, validation, bounds and canonical formatting, levels 0-2. no_std, zero dependencies."
keywords = ["edtf", "date", "iso8601", "parser", "no-std"]
categories = ["date-and-time", "parser-implementations", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
serde_json = "=1.0.151"
# Model-side property tests; std-only subset (no fork/timeout machinery).
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# Bench-only; default features off to keep plotters/rayon out of the tree.
criterion = { version = "=0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "core"
harness = false

[features]
serde = ["dep:serde"]
