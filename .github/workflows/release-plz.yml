---
name: Release

# Release canon (renovate-config templates/release/, issue #8): release-plz
# maintains a Release PR previewing versions + changelog + semver-checks;
# MERGING that PR is the commitment point.
#
# PHASE 1 of two (issue #54). This workflow TAGS and cuts GitHub releases —
# it publishes nothing. The final step pushes the umbrella tag `v<version>`,
# which triggers publish.yml (phase 2): that run builds, publishes to
# crates.io and npm, and attests, with `github.ref` set to the tag it is
# signing for.
#
# Why the split: this workflow runs on `main`, so provenance produced here
# can only ever record `ref: refs/heads/main`. At v1.0.0 the release failed
# partway, was resumed by two dispatches, and the attestations ended up
# naming `1e80e45` — a commit that built none of the published bytes. The
# tag is the only ref that is stable, immutable (tag-immutability ruleset,
# ~ALL) and meaningful to a verifier, so publishing happens there.
#
# Account-side prerequisites (edtf#32): per-crate crates.io trusted
# publishers, the npm trusted publisher for edtf-wasm, and the
# RELEASE_PLZ_TOKEN fine-grained PAT (release PRs created with the default
# GITHUB_TOKEN would not trigger CI — the same constraint that forces the
# umbrella tag below to be pushed with the PAT).

"on":
  push:
    branches: [main]
  # Recovery path (issue #66, defect 2): release-plz refuses to tag unless
  # the current commit is a release-PR merge commit, so a defect fixed
  # AFTER the release PR merges strands the release — bumped manifests,
  # nothing tagged, nothing published, and re-running phase 1 a no-op.
  # Dispatching this workflow (from main only) creates the per-crate tags
  # and releases directly at the current commit, guarded by the same
  # "is it already on crates.io / already tagged" checks as the umbrella
  # step, then pushes the umbrella tag as usual.
  workflow_dispatch: {}

permissions: {}

# Keyed per COMMIT, not per ref. `cancel-in-progress: false` queues a
# superseded run rather than cancelling it, but GitHub holds only ONE pending
# run per group — a second push while one is queued discards the first. On a
# busy main that silently drops whichever run was waiting, and if the dropped
# one is the Release-PR merge commit, the release is never tagged and nothing
# reports a failure. Per-sha groups make displacement impossible; concurrent
# runs on distinct commits are already safe, because release-plz derives its
# decisions from registry and tag state and `needs: tag` orders the two jobs.
concurrency:
  group: release-plz-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Maintain Release PR
    # Skipped on the release commit itself. release-plz decides what is
    # releasable by diffing against the last version ON CRATES.IO, and phase 2
    # takes ~25 minutes to put it there — so running on the merge that STARTS
    # a release always sees the previous version, finds the release's own
    # manifest and lockfile changes "unreleased", and opens a spurious Release
    # PR for the version after the one currently publishing. That produced #74
    # after v1.1.0 and #78 after v1.1.1. The `needs: tag` ordering below fixed
    # tag visibility, which was a real but different problem; crates.io
    # visibility cannot be fixed by ordering within this workflow.
    #
    # The next ordinary push to main regenerates the Release PR against a
    # crates.io that has caught up.
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~40s.
    timeout-minutes: 15
    # Must observe main AFTER the tag job has cut this version's tags, or it
    # opens a duplicate Release PR for the release in flight. See the tag
    # job's comment.
    needs: tag
    permissions:
      contents: write # push the release branch
      pull-requests: write # open/update the Release PR
    steps:
      # First step of every job, before checkout: runtime egress enforcement.
      # Allowlist derived from the observed egress of the first live runs
      # (v1.0.0, 2026-07-27), closing the recorded audit-mode exception.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md). semver-checks runs inside release-plz.
          install_args: rust github:obi1kenobi/cargo-semver-checks
      - name: release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # The two chores release-plz cannot do (issue #121): the extension
      # upgrade script and fuzz/Cargo.lock, run on the Release PR branch
      # and pushed back so the PR arrives green instead of failing
      # lint:pg-upgrade-path on every single release. prepare-release.sh
      # still refuses to invent SQL when the surface moved — that refusal
      # fails THIS step loudly, and the migration stays a person's call.
      - name: Prepare the Release PR (upgrade SQL + fuzz lockfile)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: .github/scripts/auto-prepare-release.sh

  tag:
    name: Tag on Release PR merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~40s.
    timeout-minutes: 15
    # Runs BEFORE release-pr (which needs: tag). These two used to run in
    # parallel on the same push, and on a Release-PR merge commit that is a
    # race: release-pr sees main with the version already bumped in the
    # manifests and no tags for it yet, concludes the version is unreleased,
    # and opens a SECOND Release PR for the version currently being
    # released. That happened at v1.1.0 (PR #74). Serialising costs a few
    # seconds and removes the window entirely.
    permissions:
      contents: write # push tags, create the GitHub releases
      pull-requests: read # detect the merged Release PR
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # No registry hosts: this job publishes nothing. crates.io remains
          # for cargo's index reads during release-plz's version resolution.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The umbrella-tag step pushes with an explicit PAT, so the
          # checkout credential is neither needed nor wanted here.
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          install_args: rust
      # publish = false in release-plz.toml: this creates the six per-crate
      # tags and their GitHub releases, and runs cargo publish for nothing.
      - name: release-plz release (tags + GitHub releases only)
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The umbrella tag is what publish.yml listens for, and it must be
      # pushed with the PAT — see the script header for why, and for the
      # guards that keep an ordinary push to main from minting one.
      - name: Push umbrella tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: .github/scripts/push-umbrella-tag.sh

  # Recovery: tag a fixed commit without a new release PR (issue #66).
  # Only reachable by explicit dispatch; the script's guards make it a
  # no-op-with-error on anything except a bumped-but-unpublished-and-
  # untagged version at the head of main.
  tag-dispatch:
    name: Tag current commit (dispatch recovery)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Hang guard, not a budget: observed ~40s.
    timeout-minutes: 15
    permissions:
      contents: write # create per-crate tags and GitHub releases
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          install_args: rust
      # Default token: per-crate tags are meant to trigger nothing, so
      # GitHub's recursion guard is the desired behavior here.
      - name: Create per-crate tags and releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/tag-release.sh
      # Identical to the push path: the umbrella tag needs the PAT so that
      # publish.yml actually fires. The script's own guards apply unchanged.
      - name: Push umbrella tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: .github/scripts/push-umbrella-tag.sh
