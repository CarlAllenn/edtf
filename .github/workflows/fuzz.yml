---
name: Fuzz

# Coverage-guided deep fuzzing (cargo-fuzz/libFuzzer), per issue #1. Not a
# push gate: the deterministic harness in crates/edtf-core/tests/fuzz.rs
# already runs on every push; this job digs deeper on a nightly schedule or
# on demand. Nightly toolchain is confined to this workflow (a sanctioned
# exception to the everything-via-mise rule; cargo-fuzz itself is pinned in
# mise.toml).

"on":
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds of fuzzing per target
        default: "1200"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, roundtrip]
    env:
      MISE_DISABLE_TOOLS: "cargo:cargo-pgrx,aqua:rustwasm/wasm-pack"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          cache_key_prefix: mise-fuzz-v1
      - run: rustup toolchain install nightly --profile minimal
      - name: Seed corpus from fixtures
        run: ./fuzz/seed.sh
      - name: Fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || 1200 }}
        run: |
          cargo +nightly fuzz run "$FUZZ_TARGET" -- \
            -max_total_time="$MAX_TOTAL_TIME" \
            -timeout=5
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
