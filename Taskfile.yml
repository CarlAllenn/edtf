---
version: "3"

# Every command runs with bash strict mode: exit on error, unset vars are
# errors, pipeline failures propagate.
set: [errexit, nounset, pipefail]

# Parallel deps interleave output; prefix each line with its task name.
output: prefixed

vars:
  # Pinned nightly rustfmt: the canonical config (rustfmt.toml, from
  # renovate-config templates/rustfmt/) uses nightly-only options — the
  # second sanctioned nightly exception after cargo-fuzz. No Renovate
  # datasource exists for dated nightlies; bump manually alongside stable
  # toolchain bumps. Hooks, tasks and CI all read this one value.
  RUSTFMT_TOOLCHAIN: nightly-2026-07-20
  # Files outside the coverage metric: edtf-postgres, whose tests run in the
  # pgrx harness (the pg14-18 matrix jobs) rather than under `cargo test`.
  # The exclusion is now about where the tests run and what CI would have to
  # install, NOT about instrumentability — that part turned out to be false.
  # See docs/coverage.md.
  COVERAGE_EXCLUDE: crates/edtf-postgres/

tasks:
  ci:
    desc: Everything CI runs — the full gate, identical locally and on GitHub
    deps: [lint, test]

  coverage:toolchain:
    desc: Install the pinned nightly with llvm-tools (idempotent; CI + fresh clones)
    cmds:
      - rustup toolchain install {{.RUSTFMT_TOOLCHAIN}} --profile minimal --component llvm-tools

  coverage:
    desc: Line + branch coverage over the measured workspace; writes lcov.info
    deps: [coverage:toolchain]
    cmds:
      # `--branch` is nightly-only, hence the pinned toolchain. cargo-llvm-cov
      # has to see that rustc directly: under `rustup run` its own shim lands
      # where RUSTC is expected and the build fails, so name rustc explicitly
      # and put the toolchain first on PATH (mise's stable rustc otherwise
      # shadows the rustup proxy).
      - >
        bin="$(rustup run {{.RUSTFMT_TOOLCHAIN}} rustc --print sysroot)/bin";
        RUSTC="$bin/rustc" PATH="$bin:$PATH" cargo llvm-cov
        --all-features --branch
        --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}'
        --lcov --output-path lcov.info

  coverage:table:
    desc: Re-render the per-file table from the last `task coverage` run
    cmds:
      - >
        bin="$(rustup run {{.RUSTFMT_TOOLCHAIN}} rustc --print sysroot)/bin";
        RUSTC="$bin/rustc" PATH="$bin:$PATH" cargo llvm-cov report --branch
        --ignore-filename-regex '{{.COVERAGE_EXCLUDE}}'

  coverage:check:
    desc: "Union view — every line executed, every branch side taken (issue #106)"
    cmds:
      # Not a percentage threshold (those rot into gaming, issue #8): a binary
      # invariant you cannot half-satisfy. The per-file table cannot express
      # it — see the instantiation artifact in docs/coverage.md — so the gate
      # reads the per-line records instead.
      - >
        lines=$(grep -c '^DA:[0-9]*,0$' lcov.info || true);
        sides=$(grep -c '^BRDA:.*,0$' lcov.info || true);
        echo "uncovered lines: $lines; untaken branch sides: $sides";
        test "$lines" -eq 0 && test "$sides" -eq 0

  test:
    desc: Run the test suite (all crates, all features)
    # Fingerprinted: unchanged inputs skip the run; task --force overrides.
    method: checksum
    sources: &rust-sources
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - fuzz/Cargo.lock
      - mise.toml
      - mise.lock
      - exclude: "**/target/**"
    cmds:
      - cargo test --all-features

  fmt:
    desc: Apply all formatters
    cmds:
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --all
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --manifest-path fuzz/Cargo.toml
      - taplo fmt
      - shfmt -w .

  fmt:toolchain:
    desc: Install the pinned nightly rustfmt (idempotent; CI + fresh clones)
    cmds:
      - rustup toolchain install {{.RUSTFMT_TOOLCHAIN}} --profile minimal --component rustfmt

  lint:
    desc: Run every linter over the whole repository
    deps:
      - lint:rust
      - lint:deny
      - lint:toml
      - lint:yaml
      - lint:md
      - lint:citation
      - lint:spell
      - lint:ec
      - lint:actions
      - lint:shell
      - lint:machete
      - lint:pg-upgrade-path
      - lint:scripts-exec
      - lint:fuzz

  lint:rust:
    desc: rustfmt (check) + clippy, warnings as errors
    method: checksum
    sources: *rust-sources
    cmds:
      - task: lint:fmt-check
      - cargo clippy --all-features --all-targets -- -D warnings

  lint:fmt-check:
    desc: rustfmt check, workspace + fuzz, pinned nightly
    cmds:
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --all --check
      # fuzz/ is excluded from the workspace; keep fmt honest there too.
      - cargo +{{.RUSTFMT_TOOLCHAIN}} fmt --check --manifest-path fuzz/Cargo.toml

  lint:deny:
    desc: cargo-deny (advisories, licenses, bans, sources)
    # Deliberately NOT fingerprinted: the advisories check reads the RustSec
    # database, which changes without commits — a source-checksum skip is
    # unsound for any security gate. New advisories must turn this red.
    cmds:
      - cargo deny check -D unmatched-skip

  lint:toml:
    desc: taplo format-check + lint over all TOML
    method: checksum
    sources:
      # mise.toml/mise.lock are TOML — the file class already covers the pin
      - "**/*.toml"
      - exclude: "**/target/**"
    cmds:
      - taplo fmt --check
      - taplo lint

  lint:yaml:
    desc: yamllint (strict) over all YAML
    method: checksum
    sources:
      - "**/*.yml"
      - "**/*.yaml"
      - CITATION.cff
      - .yamllint
      - mise.toml
      - mise.lock
    cmds:
      # CITATION.cff is named explicitly: yamllint discovers *.yml and *.yaml
      # only, so the citation file — which is YAML, and breaks GitHub's
      # "Cite this repository" rendering when it is malformed — would
      # otherwise go unlinted. Syntax only; the CFF schema itself is not
      # gated here (issue #142).
      - yamllint --strict . CITATION.cff

  lint:md:
    desc: markdownlint over all Markdown
    method: checksum
    sources:
      - "**/*.md"
      - .markdownlint-cli2.jsonc
      - mise.toml
      - mise.lock
    cmds:
      - markdownlint-cli2

  lint:citation:
    desc: CITATION.cff against the Citation File Format 1.2.0 schema
    # lint:yaml proves the file is YAML. This proves it is CFF — a different
    # question, and the one that catches the edits which actually break it:
    # a misspelled key, a wrong `authors` shape, an `identifiers:` block with
    # the wrong fields (issue #142 adds one by hand once Zenodo has minted
    # the concept DOI).
    #
    # The failure it guards is silent: an invalid file breaks no build and no
    # user, GitHub just stops rendering "Cite this repository" and nobody
    # finds out until they go looking for a citation.
    #
    # check-jsonschema ships the CFF schema as a builtin, so this gate is
    # offline and deterministic like the rest and carries no vendored schema
    # copy to drift. cffconvert is the format's canonical validator and was
    # rejected on age: last release 2021 (issue #149).
    method: checksum
    sources:
      - CITATION.cff
      - mise.toml
      - mise.lock
    cmds:
      - check-jsonschema --builtin-schema vendor.citation-file-format CITATION.cff

  lint:spell:
    desc: codespell over the repository
    method: checksum
    sources: &whole-tree-sources
      - "**/*"
      - .codespellrc
      - exclude: .task/**
      - exclude: .git/**
      - exclude: "**/target/**"
      - exclude: fuzz/corpus/**
      - exclude: fuzz/artifacts/**
      - exclude: pkg/**
    cmds:
      - codespell

  lint:ec:
    desc: editorconfig-checker over all tracked files
    method: checksum
    sources: *whole-tree-sources
    cmds:
      - ec

  lint:actions:
    desc: actionlint + zizmor over GitHub Actions workflows
    method: checksum
    sources:
      - .github/workflows/**
      - mise.toml
      - mise.lock
    cmds:
      - actionlint
      - zizmor --persona=pedantic --offline .github/

  lint:shell:
    desc: shellcheck + shfmt (check mode) over shell scripts
    method: checksum
    sources:
      - "**/*.sh"
      - .shellcheckrc
      - mise.toml
      - mise.lock
      - exclude: "**/target/**"
    cmds:
      - shfmt -d .
      - |
        files=$(shfmt --find .)
        [ -z "$files" ] || shellcheck $files

  lint:machete:
    desc: cargo-machete (unused dependencies, metadata mode)
    # Deterministic given the lock (verified lockfile-untouched); canon:
    # renovate-config templates/cargo-machete/README.md.
    method: checksum
    sources: *rust-sources
    cmds:
      - cargo machete --with-metadata

  lint:pg-upgrade-path:
    desc: Every released extension version must be reachable by ALTER EXTENSION UPDATE
    # Needs no Postgres — it reads the version and the sql/ directory only,
    # which is why it belongs in the lint gate rather than the pgrx job.
    method: checksum
    sources:
      - crates/edtf-postgres/Cargo.toml
      - crates/edtf-postgres/sql/**
    cmds:
      - .github/scripts/assert-upgrade-path.sh

  lint:scripts-exec:
    desc: Every .github/scripts/*.sh must be executable in git
    # Not fingerprinted on file contents: the input is the git INDEX MODE,
    # which `sources:` cannot see — a chmod changes no file content.
    cmds:
      - .github/scripts/assert-scripts-executable.sh

  lint:fuzz:
    desc: fuzz/ is outside the workspace — lock, lints and type-check it anyway
    # fuzz/ is `exclude`d in the root Cargo.toml, so NOTHING else reaches it:
    # clippy, test, docs, MSRV and semver-checks all resolve from the
    # workspace, and the nightly fuzz.yml schedule is the only thing that
    # ever compiled it. That left three holes, closed here in one task:
    #
    #   lock      — release-plz cannot bump fuzz/Cargo.lock, so a version
    #               bump left it pinning the previous edtf-core until someone
    #               remembered. `--locked` refuses to update it and fails.
    #   clippy    — the fuzz targets' use of edtf-core was unpinned by any
    #               push gate, and fuzz/Cargo.toml's 36-line [lints] mirror
    #               ("keep the three blocks in lockstep") was enforced by
    #               nothing. Stable clippy type-checks it fine; no nightly
    #               and no libFuzzer run are needed.
    #   deny      — cargo-deny resolves from the root lockfile, so fuzz/'s
    #               ten third-party crates (libfuzzer-sys, cc and friends,
    #               both of which run build scripts) were in no graph it ever
    #               saw. deny.toml's own comment names this exact failure
    #               mode as having already cost the pgrx tree once.
    method: checksum
    sources:
      - fuzz/**/*.rs
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - crates/*/Cargo.toml
      - Cargo.toml
      - deny.toml
    cmds:
      - cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - cargo deny --manifest-path fuzz/Cargo.toml check -D unmatched-skip

  release:prepare:
    desc: Do the three things every Release PR needs that release-plz cannot
    # The extension upgrade script, fuzz/Cargo.lock and CITATION.cff all sit
    # outside release-plz's reach. The first two fail the lint gate on every
    # release until someone does them by hand; the third goes stale silently,
    # which is worse. Run this once on the release branch. It refuses to
    # invent SQL if the surface actually moved.
    cmds:
      - .github/scripts/prepare-release.sh

  scan:secrets:
    desc: gitleaks over the full git history
    # Not fingerprinted: the input is git history, which sources: cannot
    # see. The staged-changes layer is the universal pre-commit hook.
    # Canon: renovate-config templates/gitleaks/README.md.
    cmds:
      - gitleaks git --no-banner --redact --verbose .

  semver:
    desc: cargo-semver-checks vs the latest published crates.io baseline
    # Own CI job, never fingerprinted: the baseline is registry state, not
    # repo content — a content-hash skip could hide a stale verdict.
    # Canon: renovate-config templates/cargo-semver-checks/README.md.
    cmds:
      - cargo semver-checks --workspace --exclude edtf-postgres

  bench:
    desc: Run the criterion benchmarks (numbers published in the README)
    cmds:
      - cargo bench -p edtf-core --bench core

  wasm:
    desc: Build the WebAssembly artifact
    cmds:
      - cargo build -p edtf-wasm --target wasm32-unknown-unknown --release

  wasm:pack:
    desc: Build the npm-ready package (JS glue + .d.ts) via wasm-pack
    cmds:
      - wasm-pack build crates/edtf-wasm --target web --out-dir pkg

  pg:lint:
    desc: clippy over the Postgres extension (requires `cargo pgrx init`)
    # Not covered by lint:rust: edtf-postgres is not a default member, and
    # linting it needs $PGRX_HOME plus exactly one pg feature.
    cmds:
      - cargo clippy -p edtf-postgres --all-targets --no-default-features --features pg18 -- -D warnings

  pg:test:
    desc: Run the Postgres extension test suite (requires `cargo pgrx init`)
    dir: crates/edtf-postgres
    cmds:
      - cargo pgrx test pg18

  pg:package:
    desc: Package the Postgres extension for installation
    dir: crates/edtf-postgres
    cmds:
      - cargo pgrx package

  pg:schema-snapshot:
    desc: Diff the generated SQL surface against the snapshot (requires `cargo pgrx init`)
    # Deliberately not fingerprinted: the snapshot's input is a pgrx BUILD,
    # not just the sources it is derived from.
    env:
      PG: 18
    cmds:
      - .github/scripts/schema-snapshot.sh
