# The repo-side Monday audit. This stub is a repo's entire audit
# obligation: the checks (today, the dependency advisory feed) arrive via
# the shared workflow and the toolbelt it pins — same model as the gate.
---
name: audit

"on":
  schedule:
    # Mondays 06:00 UTC, beside the canon's own audit.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read # the audit reads the tree and the advisory feed
    uses: monumental-archive/.github/.github/workflows/repo-audit.yml@ba1771562c6179221078179ee216e10eff4fef21 # v1.58.2
...
