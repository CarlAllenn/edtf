[package]
name = "edtf-core"
version = "1.1.2"
description = "EDTF (ISO 8601-2:2019 Annex A) parsing, validation, bounds, temporal relations and canonical formatting, levels 0-2. no_std, zero dependencies."
keywords = ["edtf", "date", "iso8601", "parser", "no-std"]
categories = ["date-and-time", "parser-implementations", "no-std"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
# Bench-only; default features off to keep plotters/rayon out of the tree.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[features]
serde = ["dep:serde"]
