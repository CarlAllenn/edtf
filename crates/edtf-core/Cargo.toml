[package]
name = "edtf-core"
version = "0.2.0"
description = "EDTF (ISO 8601-2:2019 Annex A) parsing, validation, bounds and canonical formatting, levels 0-2. no_std, zero dependencies."
keywords = ["edtf", "date", "iso8601", "parser", "no-std"]
categories = ["date-and-time", "parser-implementations", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]
