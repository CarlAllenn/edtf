# Release canon: renovate-config templates/release/ — the Release PR is the
# commitment point (recorded doctrine, 2026-07-27): merging it tags and
# creates the GitHub releases. Nothing publishes outside that path.
#
# Publishing itself moved OUT of this step (issue #54). release-plz runs on
# `main`, so any attestation produced alongside it records
# `ref: refs/heads/main` and the ref of whichever run happened to sign —
# which is how every v1.0.0 attestation ended up naming a commit that did
# not build it. Phase 1 here tags; the tag triggers publish.yml, which
# builds, publishes and attests in one run whose ref IS the tag.

[workspace]
# Breaking-change detection in the release preview (issue #7 canon).
semver_check = true
changelog_update = true
git_release_enable = true
git_tag_enable = true
# Tag and cut releases, but never publish: `cargo publish` belongs to
# publish.yml, where the run's ref is the tag it is signing for.
publish = false
# Publish only on Release PR merge, never on arbitrary pushes to main.
release_always = false
publish_timeout = "30m"

[changelog]
protect_breaking_commits = true

# Unified version: one number, one tag, all five workspace crates
# (edtf-postgres rides the same number, bumped in the Release PR by hand —
# it lives outside this workspace; see .github/workflows/publish.yml).
# The hand-bump is guarded: ci.yml's version-drift check fails the PR if
# edtf-postgres does not match this group, because the old release-time
# guard printed "already published; skipping" and exited GREEN when the
# bump was forgotten — a silent skip is how the crate went untagged at
# v1.0.0 (issue #54).
[[package]]
name = "edtf-core"
version_group = "edtf"

[[package]]
name = "edtf-calendars"
version_group = "edtf"

[[package]]
name = "edtf-normalize"
version_group = "edtf"

[[package]]
name = "edtf-wasm"
version_group = "edtf"

[[package]]
name = "edtf-cli"
version_group = "edtf"
