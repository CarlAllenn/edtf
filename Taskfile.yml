---
version: "3"

# Every command runs with bash strict mode: exit on error, unset vars are
# errors, pipeline failures propagate.
set: [errexit, nounset, pipefail]

# Parallel deps interleave output; prefix each line with its task name.
output: prefixed

tasks:
  ci:
    desc: Everything CI runs — the full gate, identical locally and on GitHub
    deps: [lint, test]

  test:
    desc: Run the test suite (all crates, all features)
    # Fingerprinted: unchanged inputs skip the run; task --force overrides.
    method: checksum
    sources: &rust-sources
      - "**/*.rs"
      - "**/Cargo.toml"
      - Cargo.lock
      - crates/edtf-postgres/Cargo.lock
      - fuzz/Cargo.lock
      - mise.toml
      - mise.lock
      - exclude: "**/target/**"
    cmds:
      - cargo test --workspace --all-features

  fmt:
    desc: Apply all formatters
    cmds:
      - cargo fmt --all
      - taplo fmt
      - shfmt -w .

  lint:
    desc: Run every linter over the whole repository
    deps:
      - lint:rust
      - lint:deny
      - lint:toml
      - lint:yaml
      - lint:md
      - lint:spell
      - lint:ec
      - lint:actions
      - lint:shell

  lint:rust:
    desc: rustfmt (check) + clippy, warnings as errors
    method: checksum
    sources: *rust-sources
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-features --all-targets -- -D warnings
      # edtf-postgres is outside the workspace (pgrx); at least keep fmt honest.
      - cargo fmt --check --manifest-path crates/edtf-postgres/Cargo.toml

  lint:deny:
    desc: cargo-deny (advisories, licenses, bans, sources)
    # Deliberately NOT fingerprinted: the advisories check reads the RustSec
    # database, which changes without commits — a source-checksum skip is
    # unsound for any security gate. New advisories must turn this red.
    cmds:
      - cargo deny check -D unmatched-skip

  lint:toml:
    desc: taplo format-check + lint over all TOML
    method: checksum
    sources:
      # mise.toml/mise.lock are TOML — the file class already covers the pin
      - "**/*.toml"
      - exclude: "**/target/**"
    cmds:
      - taplo fmt --check
      - taplo lint

  lint:yaml:
    desc: yamllint (strict) over all YAML
    method: checksum
    sources:
      - "**/*.yml"
      - "**/*.yaml"
      - .yamllint
      - mise.toml
      - mise.lock
    cmds:
      - yamllint --strict .

  lint:md:
    desc: markdownlint over all Markdown
    method: checksum
    sources:
      - "**/*.md"
      - .markdownlint-cli2.jsonc
      - mise.toml
      - mise.lock
    cmds:
      - markdownlint-cli2

  lint:spell:
    desc: codespell over the repository
    method: checksum
    sources: &whole-tree-sources
      - "**/*"
      - .codespellrc
      - exclude: .task/**
      - exclude: .git/**
      - exclude: "**/target/**"
      - exclude: fuzz/corpus/**
      - exclude: fuzz/artifacts/**
      - exclude: pkg/**
    cmds:
      - codespell

  lint:ec:
    desc: editorconfig-checker over all tracked files
    method: checksum
    sources: *whole-tree-sources
    cmds:
      - ec

  lint:actions:
    desc: actionlint + zizmor over GitHub Actions workflows
    method: checksum
    sources:
      - .github/workflows/**
      - mise.toml
      - mise.lock
    cmds:
      - actionlint
      - zizmor --persona=pedantic --offline .github/

  lint:shell:
    desc: shellcheck + shfmt (check mode) over shell scripts
    method: checksum
    sources:
      - "**/*.sh"
      - .shellcheckrc
      - mise.toml
      - mise.lock
      - exclude: "**/target/**"
    cmds:
      - shfmt -d .
      - |
        files=$(shfmt --find .)
        [ -z "$files" ] || shellcheck $files

  bench:
    desc: Run the criterion benchmarks (numbers published in the README)
    cmds:
      - cargo bench -p edtf-core --bench core

  wasm:
    desc: Build the WebAssembly artifact
    cmds:
      - cargo build -p edtf-wasm --target wasm32-unknown-unknown --release

  wasm:pack:
    desc: Build the npm-ready package (JS glue + .d.ts) via wasm-pack
    cmds:
      - wasm-pack build crates/edtf-wasm --target web --out-dir pkg

  pg:test:
    desc: Run the Postgres extension test suite (requires `cargo pgrx init`)
    dir: crates/edtf-postgres
    cmds:
      - cargo pgrx test pg18

  pg:package:
    desc: Package the Postgres extension for installation
    dir: crates/edtf-postgres
    cmds:
      - cargo pgrx package
