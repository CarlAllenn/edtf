pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-features -- -D warnings
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint

pre-push:
  commands:
    test:
      run: cargo test --workspace --all-features
