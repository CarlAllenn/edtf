name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint + test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: task check

  wasm:
    name: WebAssembly build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test -p edtf-wasm
      - run: cargo build -p edtf-wasm --target wasm32-unknown-unknown --release

  postgres:
    name: pgrx extension tests (Postgres 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Cache pgrx-managed Postgres
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pgrx
            ~/.cargo/bin/cargo-pgrx
          key: pgrx-0.19.1-pg18-${{ runner.os }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libreadline-dev zlib1g-dev
      - run: command -v cargo-pgrx || cargo install cargo-pgrx --version 0.19.1 --locked
      - run: test -f ~/.pgrx/config.toml || cargo pgrx init --pg18 download
      - run: cd crates/edtf-postgres && cargo pgrx test pg18
