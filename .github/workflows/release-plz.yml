---
name: Release

# Release canon (renovate-config templates/release/, issue #8): release-plz
# maintains a Release PR previewing versions + changelog + semver-checks;
# MERGING that PR is the commitment point.
#
# PHASE 1 of two (issue #54). This workflow TAGS and cuts GitHub releases —
# it publishes nothing. The final step pushes the umbrella tag `v<version>`,
# which triggers publish.yml (phase 2): that run builds, publishes to
# crates.io and npm, and attests, with `github.ref` set to the tag it is
# signing for.
#
# Why the split: this workflow runs on `main`, so provenance produced here
# can only ever record `ref: refs/heads/main`. At v1.0.0 the release failed
# partway, was resumed by two dispatches, and the attestations ended up
# naming `1e80e45` — a commit that built none of the published bytes. The
# tag is the only ref that is stable, immutable (tag-immutability ruleset,
# ~ALL) and meaningful to a verifier, so publishing happens there.
#
# Account-side prerequisites (edtf#32): per-crate crates.io trusted
# publishers, the npm trusted publisher for edtf-wasm, and the
# RELEASE_PLZ_TOKEN fine-grained PAT (release PRs created with the default
# GITHUB_TOKEN would not trigger CI — the same constraint that forces the
# umbrella tag below to be pushed with the PAT).

"on":
  push:
    branches: [main]

permissions: {}

# Serialize, never skip: a queued release must still run (release-plz canon),
# so cancel-in-progress stays false — the queue is the concurrency limit.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Maintain Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open/update the Release PR
    steps:
      # First step of every job, before checkout: runtime egress enforcement.
      # Allowlist derived from the observed egress of the first live runs
      # (v1.0.0, 2026-07-27), closing the recorded audit-mode exception.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md). semver-checks runs inside release-plz.
          install_args: rust github:obi1kenobi/cargo-semver-checks
      - name: release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  tag:
    name: Tag on Release PR merge
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags, create the GitHub releases
      pull-requests: read # detect the merged Release PR
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # No registry hosts: this job publishes nothing. crates.io remains
          # for cargo's index reads during release-plz's version resolution.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The umbrella-tag step pushes with an explicit PAT, so the
          # checkout credential is neither needed nor wanted here.
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.7.12
          install_args: rust
      # publish = false in release-plz.toml: this creates the five per-crate
      # tags and their GitHub releases, and runs cargo publish for nothing.
      - name: release-plz release (tags + GitHub releases only)
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The umbrella tag is what publish.yml listens for. It must be pushed
      # with the PAT: tags pushed with GITHUB_TOKEN do not trigger workflows
      # (GitHub's recursion guard), and a tag that silently triggers nothing
      # is the same failure shape as the old "already published; skipping"
      # green exit — the release would look complete and publish nothing.
      #
      # `v<version>` matches publish.yml's `v*` filter; the per-crate tags
      # (edtf-core-v1.0.1 …) do not, so exactly one run fires. This is also
      # the "one number, one tag" line in release-plz.toml made literal.
      #
      # Deliberately NOT gated on steps.release.outputs.releases_created:
      # if this step fails (expired PAT, transient API error), a re-run
      # would find nothing newly released, skip, and leave the release
      # permanently untriggered — tags cut, nothing published, green.
      # Instead the step derives its own state from the tags themselves, so
      # re-running always converges.
      - name: Push umbrella tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cargo pkgid --manifest-path crates/edtf-core/Cargo.toml | sed 's/.*[@#]//')
          anchor="edtf-core-v${version}"
          tag="v${version}"

          # No per-crate tag means release-plz has not released this version
          # (an ordinary push to main). Nothing to do.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${anchor}" >/dev/null 2>&1; then
            echo "::notice::${anchor} does not exist — no release in progress"
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::${tag} already exists; leaving it alone"
          else
            # Point the umbrella at the same commit release-plz tagged, not
            # at GITHUB_SHA — they are the same today, but deriving it from
            # the anchor keeps the two tags honest if that ever changes.
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${anchor}" -q .object.sha)
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${sha}" >/dev/null
            echo "::notice::pushed ${tag} -> ${sha}"
          fi

          # Assert it landed. A missing tag means publish.yml never fires,
          # so failing loudly here is the whole point of the check.
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null
          echo "::notice::${tag} confirmed; publish.yml takes over"
