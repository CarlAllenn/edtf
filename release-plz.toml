# Release canon: renovate-config templates/release/ — the Release PR is the
# commitment point (recorded doctrine, 2026-07-27): merging it tags and
# creates the GitHub releases. Nothing publishes outside that path.
#
# Publishing itself moved OUT of this step (issue #54). release-plz runs on
# `main`, so any attestation produced alongside it records
# `ref: refs/heads/main` and the ref of whichever run happened to sign —
# which is how every v1.0.0 attestation ended up naming a commit that did
# not build it. Phase 1 here tags; the tag triggers publish.yml, which
# builds, publishes and attests in one run whose ref IS the tag.

[workspace]
# Breaking-change detection in the release preview (issue #7 canon).
semver_check = true
changelog_update = true
git_release_enable = true
git_tag_enable = true
# Tag and cut releases, but never publish: `cargo publish` belongs to
# publish.yml, where the run's ref is the tag it is signing for.
publish = false
# Publish only on Release PR merge, never on arbitrary pushes to main.
release_always = false
publish_timeout = "30m"

[changelog]
protect_breaking_commits = true

# Unified version: one number, one tag, all six crates. edtf-postgres is a
# workspace member (see the root Cargo.toml), so release-plz owns its
# version, tag, changelog and release like every other crate — no hand-bump
# and nothing to forget. It went untagged at v1.0.0 because it sat outside
# the workspace and nothing owned it (issue #54).
[[package]]
name = "edtf-core"
version_group = "edtf"

[[package]]
name = "edtf-calendars"
version_group = "edtf"

[[package]]
name = "edtf-normalize"
version_group = "edtf"

[[package]]
name = "edtf-wasm"
version_group = "edtf"

[[package]]
name = "edtf-cli"
version_group = "edtf"

[[package]]
name = "edtf-postgres"
version_group = "edtf"
# cargo-semver-checks builds the crate to compare its API against the
# published baseline, and building pgrx needs an initialized $PGRX_HOME
# that the release runner does not have. The extension's contract is its
# SQL surface, not a Rust API, so there is no Rust semver to check: its
# lib target exists only because pgrx requires one.
semver_check = false
