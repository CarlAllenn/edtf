[package]
name = "edtf-calendars"
version = "0.1.0"
readme = "README.md"
description = "Proleptic Julian (Old Style) to Gregorian conversion at the EDTF ingest boundary. Deterministic arithmetic, no_std, zero dependencies."
keywords = ["edtf", "julian", "gregorian", "calendar", "no-std"]
categories = ["date-and-time", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
edtf-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde", "edtf-core/serde"]

[dev-dependencies]
proptest = { workspace = true }
