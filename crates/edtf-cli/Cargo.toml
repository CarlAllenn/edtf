[package]
name = "edtf-cli"
version = "0.1.0"
description = "Command-line EDTF (ISO 8601-2) validator: validate, canonicalize, level and bounds."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "edtf"
path = "src/main.rs"

[dependencies]
edtf-core = { path = "../edtf-core", version = "0.2.0" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
