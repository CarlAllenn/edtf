# Dependency policy. Canonical baseline: monumental-archive/.github scaffold/deny.toml
# (issue #5, 2026-07-26); per-repo sections filled for this tree. CI runs
# `cargo deny check -D unmatched-skip` so stale skips/ignores fail.

[graph]
# Check the graph with every feature enabled — default feature resolution can
# hide whole feature-gated subtrees from all four checks.
all-features = true
# The platforms we actually build for (mirrors mise lockfile_platforms).
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# pgrx 0.19 depends on serde_cbor, which its author archived in 2021
# (RUSTSEC-2021-0127 is informational/unmaintained, not a vulnerability —
# `patched = []` because there is nothing to patch). Tracked upstream as
# pgcentralfoundation/pgrx#524, open. Not fixable here: it is pgrx's direct
# dependency, not ours. `unused-ignored-advisory = "deny"` below means this
# entry fails CI the moment pgrx drops it, so it cannot rot.
ignore = [
  { id = "RUSTSEC-2021-0127", reason = "serde_cbor via pgrx 0.19; upstream pgrx#524" },
]
# Unmaintained advisories fail for the whole graph, not just direct deps —
# a transitive unmaintained crate is the same supply-chain exposure.
unmaintained = "all"
unused-ignored-advisory = "deny"

[licenses]
# Exactly the licenses present in the tree today — extended deliberately,
# fail-closed, when a new dependency arrives with a new (permissive) one.
# BSD-3-Clause, ISC and Zlib arrived with the pgrx tree when edtf-postgres
# joined the workspace (#54) — all permissive, all OSI-approved. Before
# that the crate sat outside the workspace and its ~150 dependencies were
# never seen by this gate at all.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
unused-allowed-license = "deny"
unused-license-exception = "deny"
private = { ignore = true }

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
# Cross-major ecosystem lag. Each entry is a RANGE over the lagging
# major/minor, not an exact version: `crate = "syn@2.0.119"` is parsed by
# cargo-deny as an exact requirement, so every Renovate lockfile refresh
# that moved a patch turned this gate red with `skipped crate was not
# encountered`. A range survives patch churn and still dies
# (-D unmatched-skip) the moment the laggard catches up. Audited 2026-07-26;
# extended 2026-07-31 when edtf-postgres became a workspace member and its
# tree became visible to this gate for the first time.
skip = [
  { crate = "syn@^2.0", reason = "several proc-macro crates lag the syn 3 move" },
  { crate = "getrandom@^0.3", reason = "tempfile (via pgrx-tests) lags getrandom 0.4" },
  { crate = "half@^1.8", reason = "serde_cbor (via pgrx) lags half 2; see the RUSTSEC-2021-0127 ignore" },
  { crate = "hashbrown@^0.15", reason = "petgraph (via pgrx-sql-entity-graph) lags hashbrown 0.17" },
  { crate = "rand@^0.9", reason = "proptest lags the rand 0.10 move that pgrx already took" },
  { crate = "rand_core@^0.9", reason = "pulled by rand 0.9.5, same lag" },
  { crate = "shlex@^1.3", reason = "bindgen (via pgrx-bindgen) lags shlex 2" },
  { crate = "toml@^0.9", reason = "cargo_toml (via pgrx-pg-config) lags toml 1" },
  { crate = "toml_datetime@^0.7", reason = "pulled by toml 0.9, same lag" },
  { crate = "winnow@^0.7", reason = "pulled by toml 0.9, same lag" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[bans.std-replacements]

[bans.build]
# Every crate in the tree with a build script or compile-time execution,
# enumerated from the lockfile (cargo metadata, 2026-07-26; extended
# 2026-07-31 for the pgrx tree). New entries arrive via CI failure ->
# review -> addition here. pgrx cannot work without build scripts:
# pgrx-pg-sys runs bindgen against the local Postgres headers to generate
# its FFI bindings, which is the entire mechanism.
allow-build-scripts = [
  "alloca",
  "anyhow",
  "bindgen",
  "camino",
  "cee-scape",
  "clang-sys",
  "crunchy",
  "eyre",
  "getrandom",
  "icu_normalizer_data",
  "icu_properties_data",
  "libc",
  "num-traits",
  "objc2",
  "owo-colors",
  "parking_lot_core",
  "pgrx-pg-sys",
  "proc-macro2",
  "quote",
  "radium",
  "rustix",
  "rustversion",
  "serde",
  "serde_core",
  "serde_json",
  "thiserror",
  "wasm-bindgen",
  "wasm-bindgen-shared",
  "wit-bindgen",
  "zerocopy",
  "zmij",
]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true

# Reviewed script shipments inside compile-time crates (audited 2026-07-26).
[[bans.build.bypass]]
crate = "libc"
# Maintainer utility script, never executed by build.rs.
allow-globs = ["etc/libc-util.py"]

[[bans.build.bypass]]
crate = "zerocopy"
# CI/release helper scripts left in the published crate, never executed by
# build.rs.
allow-globs = ["ci/**", "*.sh", "*.bat"]

[[bans.build.bypass]]
crate = "wasm-bindgen-macro"
# Static JS snippet embedded by the macro for wasm worker support; data, not
# a compile-time executable.
allow-globs = ["src/worker.js"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
unused-allowed-source = "deny"
unused-allowed-org = "deny"
